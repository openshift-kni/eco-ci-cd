---
collect_metrics_ci_lane: "ci-lane-1"
collect_metrics_list:
  - general_ocp
  - sriov
  - acm
collect_metrics_output_file: /tmp/collect_metrics_test/combined-multi-category/metrics.txt
collect_metrics_kubeconfig: "/fake/kubeconfig"

_cluster_version:
  resources:
    - status:
        desired:
          version: "4.17.9"
_infra:
  resources:
    - status:
        infrastructureName: "test-cluster-abc123"
_worker_nodes:
  resources:
    - metadata:
        name: worker-0
      status:
        nodeInfo:
          kernelVersion: "5.14.0-427.el9.x86_64"
_sriov_sub:
  resources:
    - status:
        installedCSV: sriov-network-operator.v4.17.0
_acm_sub:
  resources:
    - status:
        installedCSV: advanced-cluster-management.v2.11.0

expected_facts:
  # general_ocp also sets collect_metrics_spoke_kubeconfig/_hub_kubeconfig
  # from collect_metrics_kubeconfig, so sriov (spoke) and acm (hub) can run
  # off the single-cluster kubeconfig without being set explicitly.
  collect_metrics_attributes: >-
    ocp_build:4.17.9;ocp_version:4.17;cluster_name:test-cluster-abc123;worker-0_kernel_version:5.14.0-427.el9.x86_64;sriov_operator:4.17.0;acm_operator:2.11.0;ci-lane:ci-lane-1
