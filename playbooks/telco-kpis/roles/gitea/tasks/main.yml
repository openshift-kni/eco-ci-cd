---
# Main entry point for Gitea role
# Supports three publishing modes (report_publish_mode):
#   - prod: publish to external git repo (report_repo_url)
#   - dev-bastion: deploy local Gitea on bastion (same host as Ansible play)
#   - dev-hypervisor: deploy Gitea on hypervisor (shared across all bastions)

# === dev-bastion: Gitea on bastion ===
- name: Validate credentials from vault
  ansible.builtin.include_tasks: validate-credentials.yml
  when: report_publish_mode | default('prod') == 'dev-bastion'

- name: Deploy Gitea on bastion
  ansible.builtin.include_tasks: deploy.yml
  when: report_publish_mode | default('prod') == 'dev-bastion'

- name: Initialize Gitea on bastion
  ansible.builtin.include_tasks: initialize.yml
  when: report_publish_mode | default('prod') == 'dev-bastion'

- name: Create report repository on bastion Gitea
  ansible.builtin.include_tasks: create-repository.yml
  when: report_publish_mode | default('prod') == 'dev-bastion'

# === dev-hypervisor: Gitea on hypervisor (shared instance) ===
- name: Validate credentials from vault
  ansible.builtin.include_tasks: validate-credentials.yml
  when: report_publish_mode | default('prod') == 'dev-hypervisor'

- name: Deploy and initialize Gitea on hypervisor
  ansible.builtin.include_tasks: deploy-hypervisor.yml
  when: report_publish_mode | default('prod') == 'dev-hypervisor'

# === prod: external repository ===
- name: Setup production repository
  ansible.builtin.include_tasks: setup-production-repo.yml
  when:
    - report_publish_mode | default('prod') == 'prod'
    - report_repo_url | default('') | length > 0

# === Publish report (shared logic for all modes) ===
- name: Include report publishing tasks
  ansible.builtin.include_tasks: publish-report.yml
  when:
    - >-
      (report_publish_mode | default('prod') in ['dev-bastion', 'dev-hypervisor']) or
      (report_publish_mode | default('prod') == 'prod' and report_repo_url | default('') | length > 0)
    - report_file is defined
    - report_tarball is defined
