- name: Create temp directory for templates
  ansible.builtin.tempfile:
    state: directory
    prefix: oran-o2ims-
  register: oran_o2ims_tmp_dir

- name: Create template for oran-o2ims inventory
  ansible.builtin.template:
    src: inventory.yaml.j2
    dest: "{{ oran_o2ims_tmp_dir.path }}/inventory.yaml"
    mode: "0644"

- name: Create template for o2ims-client-cert
  ansible.builtin.template:
    src: o2ims-client-cert.yaml.j2
    dest: "{{ oran_o2ims_tmp_dir.path }}/o2ims-client-cert.yaml"
    mode: "0644"

- name: Create template for trusted-ca-bundle
  ansible.builtin.template:
    src: trusted-ca-bundle.yaml.j2
    dest: "{{ oran_o2ims_tmp_dir.path }}/trusted-ca-bundle.yaml"
    mode: "0644"

- name: Create template for oauth-client-secrets
  ansible.builtin.template:
    src: oauth-client-secrets.yaml.j2
    dest: "{{ oran_o2ims_tmp_dir.path }}/oauth-client-secrets.yaml"
    mode: "0644"

- name: Apply template for oran-o2ims inventory
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    src: "{{ oran_o2ims_tmp_dir.path }}/inventory.yaml"

- name: Apply template for o2ims-client-cert
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    src: "{{ oran_o2ims_tmp_dir.path }}/o2ims-client-cert.yaml"

# We delete the existing trusted-ca-bundle configmap to ensure that when we
# apply the new one, it injects the updated CA bundle with the bootstrapped
# root CA.
- name: Remove existing trusted-ca-bundle configmap
  kubernetes.core.k8s:
    state: absent
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    api_version: v1
    kind: ConfigMap
    name: o2ims-trusted-ca-bundle
    namespace: "{{ oran_o2ims_deploy_namespace }}"

- name: Apply template for trusted-ca-bundle
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    src: "{{ oran_o2ims_tmp_dir.path }}/trusted-ca-bundle.yaml"

# no_log because the rendered manifest embeds the o2ims-client secret derived
# from the realm export (see tasks/main.yaml).
- name: Apply template for oauth-client-secrets
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    src: "{{ oran_o2ims_tmp_dir.path }}/oauth-client-secrets.yaml"
  no_log: true

- name: Wait for SMO registration to complete
  kubernetes.core.k8s_info:
    api_version: ocloud.openshift.io/v1alpha1
    kind: Inventory
    name: default
    namespace: "{{ oran_o2ims_deploy_namespace }}"
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    wait: true
    wait_condition:
      type: SmoRegistrationCompleted
      status: "True"
    wait_sleep: 30
    wait_timeout: 1800
