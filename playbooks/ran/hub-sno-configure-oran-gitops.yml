---
# This playbook applies the O-RAN specific GitOps (ArgoCD) configuration on the hub
# cluster. It is the O-RAN counterpart of deploy-spoke-ztp.yml: instead of deploying a
# spoke via ZTP siteconfigs/policygentemplates, it repoints the ArgoCD "clusters" and
# "policies" applications at the O-RAN clustertemplates/policytemplates and whitelists
# the O-RAN CRDs so the spoke can later be provisioned from within the tests
# (via ProvisioningRequest), not by CI.
#
# Ported from the ocp-edge linchpin role deploy-gitops-du/tasks/setup_for_oran.yaml.
#
# Prerequisites:
#   - hub-sno-configure-kustomize-plugin.yml must be run first to extract the ZTP
#     ArgoCD artifacts to {{ ztp_workdir_out_path }}/argocd/deployment
#   - OpenShift GitOps operator installed and configured (hub-sno-configure-gitops.yml)
#   - SSH access to bastion node
#
# Usage:
#   ansible-playbook -i inventories/ocp-deployment/build-inventory.py \
#     playbooks/ran/hub-sno-configure-oran-gitops.yml \
#     --extra-vars "kubeconfig=/path/to/kubeconfig \
#                   oran_clusters_repo_url=https://gitlab.example.com/group/ztp.git \
#                   oran_clusters_repo_branch=oran-4.22 \
#                   oran_policies_repo_url=https://gitlab.example.com/group/ztp.git \
#                   oran_policies_repo_branch=oran-4.22"
#
# Required variables:
#   kubeconfig: Path to kubeconfig file for hub cluster authentication
#   oran_clusters_repo_url: Git repository URL hosting the O-RAN clustertemplates
#   oran_clusters_repo_branch: Git branch/revision for the clustertemplates
#   oran_policies_repo_url: Git repository URL hosting the O-RAN policytemplates
#   oran_policies_repo_branch: Git branch/revision for the policytemplates
#
# Optional variables:
#   oran_clusters_repo_path: ArgoCD source path for clusters app (default: clustertemplates)
#   oran_policies_repo_path: ArgoCD source path for policies app (default: policytemplates)

- name: Configure hub cluster ArgoCD for O-RAN provisioning
  hosts: bastion
  gather_facts: false
  become: false
  environment:
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig }}"
    KUBECONFIG: "{{ kubeconfig }}"
  vars:
    ztp_workdir_path: "/tmp/ztp-workdir"
    ztp_workdir_out_path: "{{ ztp_workdir_path }}/out"
    argocd_deployment_path: "{{ ztp_workdir_out_path }}/argocd/deployment"
    openshift_gitops_namespace: "openshift-gitops"
    oran_clusters_repo_path: "clustertemplates"
    oran_policies_repo_path: "policytemplates"
    # Default policies repo to the clusters repo unless overridden.
    oran_policies_repo_url: "{{ oran_clusters_repo_url }}"
    oran_policies_repo_branch: "{{ oran_clusters_repo_branch }}"

  tasks:
    - name: Validate required variables are defined
      ansible.builtin.assert:
        that:
          - kubeconfig is defined
          - kubeconfig | length > 0
          - oran_clusters_repo_url is defined
          - oran_clusters_repo_url | length > 0
          - oran_clusters_repo_branch is defined
          - oran_clusters_repo_branch | length > 0
        fail_msg: |
          Required variables must be defined:
            - kubeconfig: Path to hub kubeconfig
            - oran_clusters_repo_url: Git repo URL for the O-RAN clustertemplates
            - oran_clusters_repo_branch: Git branch for the O-RAN clustertemplates
        success_msg: "All required variables are defined"

    # The ProvisioningRequest CRD (installed by the o-cloud-manager operator)
    # may not exist yet on a fresh hub; query the CRD first so its absence is
    # not fatal.
    - name: Check if the ProvisioningRequest CRD exists
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: provisioningrequests.clcm.openshift.io
        kubeconfig: "{{ kubeconfig }}"
      register: provisioning_request_crd

    - name: List existing ProvisioningRequest resources
      when: provisioning_request_crd.resources | length > 0
      kubernetes.core.k8s_info:
        api_version: clcm.openshift.io/v1alpha1
        kind: ProvisioningRequest
        kubeconfig: "{{ kubeconfig }}"
      register: provisioning_requests

    - name: Cleanup existing ProvisioningRequest resources
      when: provisioning_requests.resources | default([]) | length > 0
      kubernetes.core.k8s:
        state: absent
        api_version: clcm.openshift.io/v1alpha1
        kind: ProvisioningRequest
        name: "{{ item.metadata.name }}"
        namespace: "{{ item.metadata.namespace | default(omit) }}"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        wait_timeout: 600
      loop: "{{ provisioning_requests.resources }}"

    - name: Ensure ArgoCD deployment kustomization exists
      ansible.builtin.stat:
        path: "{{ argocd_deployment_path }}/kustomization.yaml"
      register: deployment_kustomize_stat

    - name: Fail if ArgoCD deployment kustomization is missing
      ansible.builtin.fail:
        msg: |
          {{ argocd_deployment_path }}/kustomization.yaml not found.
          Run hub-sno-configure-kustomize-plugin.yml first to extract the ZTP ArgoCD artifacts.
      when: not deployment_kustomize_stat.stat.exists

    - name: Add O-RAN patches to deployment kustomization
      ansible.builtin.blockinfile:
        path: "{{ argocd_deployment_path }}/kustomization.yaml"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - O-RAN"
        insertafter: EOF
        block: |
          patches:
            - patch: |-
                - op: replace
                  path: /spec/source
                  value:
                    path: {{ oran_clusters_repo_path }}
                    repoURL: "{{ oran_clusters_repo_url }}"
                    targetRevision: "{{ oran_clusters_repo_branch }}"
                - op: add
                  path: /spec/ignoreDifferences/-
                  value:
                    group: metal3.io
                    jsonPointers:
                    - /spec/preprovisioningNetworkDataName
                    - /spec/online
                    kind: BareMetalHost
              target:
                name: clusters
                namespace: openshift-gitops
            - patch: |-
                - op: replace
                  path: /spec/source
                  value:
                    path: {{ oran_policies_repo_path }}
                    repoURL: "{{ oran_policies_repo_url }}"
                    targetRevision: "{{ oran_policies_repo_branch }}"
              target:
                name: policies
                namespace: openshift-gitops
            - patch: |-
                - op: add
                  path: /spec/destinations/-
                  value:
                    namespace: 'sno*'
                    server: '*'
                - op: add
                  path: /spec/destinations/-
                  value:
                    namespace: 'oran*'
                    server: '*'
              target:
                name: policy-app-project
                namespace: openshift-gitops
            - patch: |-
                - op: add
                  path: /spec/namespaceResourceWhitelist/-
                  value:
                    group: metal3.io
                    kind: BareMetalHost
                - op: add
                  path: /spec/namespaceResourceWhitelist/-
                  value:
                    group: clcm.openshift.io
                    kind: ClusterTemplate
                - op: add
                  path: /spec/namespaceResourceWhitelist/-
                  value:
                    group: clcm.openshift.io
                    kind: HardwarePlugin
                - op: add
                  path: /spec/namespaceResourceWhitelist/-
                  value:
                    group: clcm.openshift.io
                    kind: HardwareTemplate
                - op: add
                  path: /spec/namespaceResourceWhitelist/-
                  value:
                    group: clcm.openshift.io
                    kind: HardwareProfile
                - op: add
                  path: /spec/namespaceResourceWhitelist/-
                  value:
                    group: ocloud.openshift.io
                    kind: Location
                - op: add
                  path: /spec/namespaceResourceWhitelist/-
                  value:
                    group: ocloud.openshift.io
                    kind: OCloudSite
                - op: add
                  path: /spec/namespaceResourceWhitelist/-
                  value:
                    group: ocloud.openshift.io
                    kind: ResourcePool
              target:
                name: ztp-app-project
                namespace: openshift-gitops
            # Grant the ArgoCD application controller permission to manage the
            # O-RAN resources. hub-rds-cluster-role aggregates into the
            # cluster-manager-admin role that is bound cluster-wide to the
            # controller SA (CRB hub-rds-gitops), so appending these rules lets
            # ArgoCD create the resources on its first sync — no post-apply
            # RoleBinding or re-trigger needed.
            - patch: |-
                - op: add
                  path: /rules/-
                  value:
                    apiGroups: [metal3.io]
                    resources: [baremetalhosts]
                    verbs: [create, get, list, watch, update, delete, patch]
                - op: add
                  path: /rules/-
                  value:
                    apiGroups: [clcm.openshift.io]
                    resources: [clustertemplates, hardwareplugins, hardwaretemplates, hardwareprofiles]
                    verbs: [create, get, list, watch, update, delete, patch]
                - op: add
                  path: /rules/-
                  value:
                    apiGroups: [ocloud.openshift.io]
                    resources: [locations, ocloudsites, resourcepools]
                    verbs: [create, get, list, watch, update, delete, patch]
              target:
                kind: ClusterRole
                name: hub-rds-cluster-role

    - name: Read patched deployment kustomization
      ansible.builtin.slurp:
        src: "{{ argocd_deployment_path }}/kustomization.yaml"
      register: patched_kustomization

    - name: Show patched deployment kustomization
      ansible.builtin.debug:
        msg: "{{ (patched_kustomization.content | b64decode).splitlines() }}"

    # Kept as an oc command: kubernetes.core.k8s (2.4.x) cannot apply a
    # kustomization directory (its `src` only reads plain YAML files, and the
    # kustomize lookup would render on the controller instead of the bastion
    # where the kustomization lives).
    - name: Apply ArgoCD deployment kustomization
      ansible.builtin.command:
        cmd: oc apply -k {{ argocd_deployment_path }}
      changed_when: true

    # RBAC is granted at apply time via the hub-rds-cluster-role patch above, so
    # ArgoCD creates the O-RAN resources (and the ClusterTemplate namespace) on
    # its first automated sync. Just wait for that sync to settle.
    - name: Wait for O-RAN ArgoCD apps to be Synced and Healthy
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: "{{ item }}"
        namespace: "{{ openshift_gitops_namespace }}"
        kubeconfig: "{{ kubeconfig }}"
      register: app_status
      until: >-
        app_status.resources[0].status.sync.status | default('') == 'Synced' and
        app_status.resources[0].status.health.status | default('') in ['Healthy', 'Progressing']
      loop:
        - clusters
        - policies
      retries: 20
      delay: 30

    - name: Wait for all BareMetalHosts to become available
      # ArgoCD has synced the BMH resources. Wait here so callers know hardware
      # inspection completed and the nodes are ready for ProvisioningRequests.
      kubernetes.core.k8s_info:
        api_version: metal3.io/v1alpha1
        kind: BareMetalHost
        kubeconfig: "{{ kubeconfig }}"
      register: _bmh_status
      until: >-
        _bmh_status.resources | length > 0 and
        _bmh_status.resources | selectattr('status.provisioning.state', 'defined')
        | selectattr('status.provisioning.state', 'equalto', 'available') | list | length
        == _bmh_status.resources | length
      retries: 40
      delay: 30

    # o-cloud-manager needs a pull-secret in the ClusterTemplate namespace so
    # spoke nodes can pull from the disconnected registry. We use a minimal
    # pull-secret containing only the disconnected registry credentials
    # (stored in Vault as part of telcov10n-oran-mtls-oauth, key
    # pull-secret.json) rather than the hub's full openshift-config/pull-secret
    # which contains upstream registries the disconnected spoke cannot reach.
    - name: Apply disconnected-registry pull-secret to ClusterTemplate namespace
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pull-secret
            namespace: "sno-ran-du-v{{ oran_clusters_repo_path | basename | replace('.', '-') }}"
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ lookup('file', oran_pull_secret_file | default('/var/oran-secrets/pull-secret.json')) | b64encode }}"
      no_log: true

    - name: Get spoke release image from cluster version
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: ClusterVersion
        name: version
        kubeconfig: "{{ kubeconfig }}"
      register: cluster_version_info

    - name: Create ClusterImageSet for spoke cluster provisioning
      when: cluster_version_info.resources | length > 0
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: hive.openshift.io/v1
          kind: ClusterImageSet
          metadata:
            name: "{{ ocp_version }}"
          spec:
            releaseImage: "{{ cluster_version_info.resources[0].status.desired.image }}"
