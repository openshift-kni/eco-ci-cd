---
spoke_cluster: "test-spoke"
hub_kubeconfig: "/fake/kubeconfig"
generate_detailed_summary: true

# gather_facts is off in test.yml (for determinism across cases), so pin the
# one ansible_date_time field generate_detailed_summary.yml reads instead of
# letting it read the real wall clock.
ansible_date_time:
  iso8601: "2026-01-01T02:00:00Z"

clusterinstance_query:
  resources:
    - metadata:
        creationTimestamp: "2026-01-01T00:00:00Z"
        name: test-spoke
      spec:
        clusterName: test-spoke
      status:
        conditions: []
managedcluster_query:
  resources:
    - metadata:
        creationTimestamp: "2026-01-01T00:01:00Z"
        labels: {}
      status:
        conditions: []
agentclusterinstall_query:
  resources:
    - metadata:
        creationTimestamp: "2026-01-01T00:02:00Z"
      status:
        conditions: []
imagebasedinstall_query:
  resources: []
talm_cgu_query:
  resources:
    - metadata:
        name: test-spoke
      status:
        status:
          completedAt: "2026-01-01T01:00:00Z"
        conditions: []
infraenv_query:
  resources: []
agents_query:
  resources: []
manifestworks_query:
  resources: []
policies_query:
  resources: []

expected_facts:
  ztp_deployment_timeline_success: true
  ztp_deployment_timeline_duration_seconds: 3600
