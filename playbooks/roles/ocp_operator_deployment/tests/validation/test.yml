---
# Full-role test runner for ocp_operator_deployment - validation/routing
# fixtures ONLY (see ../README.md). These abort before reaching any live
# k8s/redhatci.ocp call, so it's safe to run the whole role via include_role.
# Not meant to be run on its own. Pass a fixture from cases/ via
# -e "@cases/<name>.yml".
- name: Unit test ocp_operator_deployment role (validation/routing fixtures)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    expected_facts: {}
    expected_undefined_facts: []

  tasks:
    - name: Run role under test
      ansible.builtin.include_role:
        name: ocp_operator_deployment

    - name: Assert expected facts match actual values
      ansible.builtin.assert:
        that:
          - (lookup('vars', item.key, default='UNDEFINED')) | string == item.value | string
        fail_msg: >-
          {{ item.key }}: expected '{{ item.value }}', got
          '{{ lookup('vars', item.key, default='UNDEFINED') }}'
        success_msg: "{{ item.key }} == {{ item.value }}"
      loop: "{{ expected_facts | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert facts that should be unset are unset
      ansible.builtin.assert:
        that:
          - lookup('varnames', '^' + item + '$') | length == 0
        fail_msg: "{{ item }} was expected to be unset but got '{{ lookup('vars', item, default='') }}'"
        success_msg: "{{ item }} is unset as expected"
      loop: "{{ expected_undefined_facts }}"
