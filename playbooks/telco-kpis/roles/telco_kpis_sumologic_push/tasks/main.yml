---
# STUB IMPLEMENTATION - telco_kpis_sumologic_push role
# TODO: Complete implementation when SumoLogic infrastructure is ready

# This stub provides the same interface as telco_kpis_splunk_push
# to enable testing of the push-to-data-lake playbook orchestration

- name: Log SumoLogic push not implemented
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "SumoLogic Push - NOT IMPLEMENTED"
      - "=========================================="
      - "SumoLogic infrastructure is not yet ready"
      - "This is a stub implementation"
      - "Tests requested: {{ tkslp_report_data.test_results | length }}"
      - "Spoke cluster: {{ tkslp_spoke_cluster }}"
      - "=========================================="

- name: Set stub result
  ansible.builtin.set_fact:
    sumologic_push_result:
      success: false
      urls: {}
      error_msg: "SumoLogic push not implemented - infrastructure not ready"
      events_sent: 0

