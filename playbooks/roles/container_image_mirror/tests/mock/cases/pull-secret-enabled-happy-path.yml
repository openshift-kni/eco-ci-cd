---
container_image_mirror_operation: mirror
container_image_mirror_test_mode: true
container_image_mirror_registry_host: "registry.example.com"
container_image_mirror_registry_namespace: "ns/"
container_image_mirror_use_pull_secret: true
container_image_mirror_pull_secret_path: /tmp/container_image_mirror_test/pull-secret.json
container_image_mirror_pull_secret_string: "eyJhdXRocyI6eyJyZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJhdXRoIjoiZEdWemREcDBaWE4wIn19fQ=="
container_image_mirror_images:
  - source: "quay.io/org/image-a:v1.0"
    dest: "org/image-a:v1.0"

_mirror_result:
  results:
    - rc: 0
      image_item:
        source: "quay.io/org/image-a:v1.0"
        dest: "org/image-a:v1.0"

# Real (not mocked) local-disk staging/cleanup of the pull secret - only the
# skopeo/registry-check calls are mocked via container_image_mirror_test_mode
assert_pull_secret_cleaned_up: true
