---
# Task-level test runner for resolve_operator_group_spec.yml - bypasses
# include_role/live OLM install entirely, exercising just the
# operator_group_spec_config resolution logic in isolation. Not meant to be
# run on its own - see ../README.md. Pass a fixture from cases/ via
# -e "@cases/<name>.yml".
- name: Unit test ocp_operator_deployment's resolve_operator_group_spec.yml
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    expected_facts: {}
    expected_undefined_facts: []

  tasks:
    - name: Run task file under test
      ansible.builtin.include_tasks: >-
        {{ playbook_dir }}/../../tasks/resolve_operator_group_spec.yml

    - name: Assert expected facts match actual values
      ansible.builtin.assert:
        that:
          - (lookup('vars', item.key, default='UNDEFINED')) | string == item.value | string
        fail_msg: >-
          {{ item.key }}: expected '{{ item.value }}', got
          '{{ lookup('vars', item.key, default='UNDEFINED') }}'
        success_msg: "{{ item.key }} == {{ item.value }}"
      loop: "{{ expected_facts | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert facts that should be unset are unset
      ansible.builtin.assert:
        that:
          - lookup('varnames', '^' + item + '$') | length == 0
        fail_msg: "{{ item }} was expected to be unset but got '{{ lookup('vars', item, default='') }}'"
        success_msg: "{{ item }} is unset as expected"
      loop: "{{ expected_undefined_facts }}"
