---
# Send Splunk HEC event(s) for one test result
# Expects: _tksp_test_item (dict with key and value)
# Handles multi-event tests (e.g., reboot sends 2 events: soft_reboot + power_cycle)

- name: Map report status to legacy JUnit status values
  ansible.builtin.set_fact:
    _tksp_legacy_status: >-
      {{ {'PASS': 'passed', 'FAIL': 'failed', 'N/A': 'skipped'}[_tksp_test_item.value.status | default('')]
         | default(_tksp_test_item.value.status | default('') | lower) }}

- name: Extract test-specific fields
  ansible.builtin.set_fact:
    _tksp_test_specific: >-
      {{ _tksp_test_item.value | dict2items
         | rejectattr('key', 'in', ['test_type', 'status'])
         | items2dict }}

- name: Transform cpu_util scenarios (add duration to each scenario)
  when: _tksp_test_item.value.test_type == 'cpu_util'
  block:
    - name: Get test duration
      ansible.builtin.set_fact:
        _tksp_cpu_duration: "{{ _tksp_test_item.value.duration | default('') }}"

    - name: Add duration to each scenario
      ansible.builtin.set_fact:
        _tksp_test_specific: >-
          {{ _tksp_test_specific | combine({
            'scenarios': _tksp_test_specific.scenarios | default([])
              | map('combine', {'duration': _tksp_cpu_duration})
              | list
          }) }}

- name: Transform rfc2544 histogram data
  when: _tksp_test_item.value.test_type == 'rfc-2544'
  block:
    - name: Transform histogram from raw string to structured format
      ansible.builtin.shell: |
        python3 << 'PYEOF'
        import os, re, json

        hist_str = os.environ.get('HIST_RAW', '')
        max_delay = float(os.environ.get('MAX_DELAY', '0'))

        if not hist_str.strip():
            print(json.dumps({'histogram': [], 'under_30_nines': [100, 100]}))
            raise SystemExit(0)

        entries = [e.strip() for e in hist_str.split(';') if e.strip()]
        histogram = []
        total_fwd = 0
        total_bwd = 0
        under30_fwd = 0
        under30_bwd = 0

        for entry in entries:
            bin_match = re.search(r'\{([^{}]*)\}', entry)
            if not bin_match:
                continue
            bin_desc = bin_match.group(1)
            parts = entry.split(',')
            fwd_str = parts[1].strip() if len(parts) > 1 else '0'
            bwd_str = parts[2].strip() if len(parts) > 2 else '0'
            fwd = int(fwd_str)
            bwd = int(bwd_str)
            total_fwd += fwd
            total_bwd += bwd

            nums = [float(v) for v in re.findall(r'\d+\.\d+', bin_desc)]
            if '>=' in bin_desc:
                mid = str(nums[0]) + '+' if nums else '0+'
                is_under_30 = False
            else:
                if len(nums) >= 2:
                    mid = round(sum(nums) / len(nums), 2)
                elif len(nums) == 1:
                    mid = nums[0]
                else:
                    mid = 0
                is_under_30 = (nums[-1] if nums else 0) < 30.0

            if is_under_30:
                under30_fwd += fwd
                under30_bwd += bwd

            histogram.append({
                'bin': mid,
                'values': [
                    {'val': fwd_str, 'direction': 'forward'},
                    {'val': bwd_str, 'direction': 'back'}
                ]
            })

        def calc_nines(total, under):
            if total == 0:
                return 100
            pct = (under / total) * 100
            if pct == 100:
                return 100
            pct_str = f'{pct:.10f}'
            decimal = pct_str.split('.')[1] if '.' in pct_str else ''
            count = 0
            for c in decimal:
                if c == '9':
                    count += 1
                else:
                    break
            return count

        if max_delay < 30.0:
            under_30_nines = [100, 100]
        else:
            under_30_nines = [
                calc_nines(total_fwd, under30_fwd),
                calc_nines(total_bwd, under30_bwd)
            ]

        print(json.dumps({'histogram': histogram, 'under_30_nines': under_30_nines}))
        PYEOF
      environment:
        HIST_RAW: "{{ _tksp_test_specific.histogram_raw | default('') }}"
        MAX_DELAY: "{{ _tksp_test_specific.max_latency | default(0) | string }}"
      register: _tksp_rfc2544_hist_result
      changed_when: false
      failed_when: false

    - name: Parse histogram transformation result
      ansible.builtin.set_fact:
        _tksp_rfc2544_hist_data: >-
          {{ _tksp_rfc2544_hist_result.stdout | from_json
             if (_tksp_rfc2544_hist_result.rc | default(1) == 0
                 and _tksp_rfc2544_hist_result.stdout | default('') | length > 0)
             else {'histogram': [], 'under_30_nines': [100, 100]} }}

    - name: Add transformed histogram to test data
      ansible.builtin.set_fact:
        _tksp_test_specific: >-
          {{ _tksp_test_specific | combine({
            'histogram': _tksp_rfc2544_hist_data.histogram | default([]),
            'under_30_nines': _tksp_rfc2544_hist_data.under_30_nines | default([100, 100])
          }) }}

- name: Check if test requires multi-event handling (reboot)
  ansible.builtin.set_fact:
    _tksp_is_multi_event: "{{ _tksp_test_item.value.test_type == 'reboot' }}"

- name: Build multi-events for reboot test
  when: _tksp_is_multi_event | bool
  ansible.builtin.set_fact:
    _tksp_events_list:
      - test_type: "reboot"
        reboot_type: "soft_reboot"
        Iterations: "{{ _tksp_test_item.value.soft_reboot_iterations | default([]) }}"
      - test_type: "reboot"
        reboot_type: "power_cycle"
        Iterations: "{{ _tksp_test_item.value.power_cycle_iterations | default([]) }}"

- name: Build single-event list for non-reboot tests
  when: not (_tksp_is_multi_event | bool)
  ansible.builtin.set_fact:
    _tksp_events_list:
      - "{{ _tksp_test_specific }}"

- name: Process each event in the list
  ansible.builtin.include_tasks: send_single_event.yml
  loop: "{{ _tksp_events_list }}"
  loop_control:
    loop_var: _tksp_event_data
    index_var: _tksp_event_idx
    label: "{{ _tksp_event_data.test_type | default(_tksp_test_item.value.test_type) }}-{{ _tksp_event_idx }}"
