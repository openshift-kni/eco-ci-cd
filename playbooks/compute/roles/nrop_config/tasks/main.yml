---
- name: Ensure required variables are defined
  ansible.builtin.assert:
    that:
      - kubeconfig is defined
      - test_env is defined
    fail_msg: "Required variables are not defined"

- name: Create workdir
  ansible.builtin.include_tasks: create_workdir.yml
  when: deploy_performance_profile_only | bool is false

- name: Get Cluster version
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: ClusterVersion
    name: version
  register: api_version

- name: Set ocp_version
  ansible.builtin.set_fact:
    ocp_version_major: "{{ api_version.resources[0].status.desired.version.split('.')[0] }}"
    ocp_version_minor: "{{ api_version.resources[0].status.desired.version.split('.')[1] }}"

- name: Set NROP target version
  ansible.builtin.set_fact:
    nrop_config_version: "{{ nrop_config_target_version if nrop_config_target_version | length > 0 else (ocp_version_major ~ '.' ~ ocp_version_minor) }}"

- name: Set NROP registry namespace from OCP version
  ansible.builtin.set_fact:
    nrop_registry_ns: "{{ 'openshift5' if nrop_config_version is version('5.0', '>=') else 'openshift4' }}"

- name: Set scheduler image registry from OCP version
  ansible.builtin.set_fact:
    image_uri:
      prod: "registry.redhat.io/{{ nrop_registry_ns }}"
      stage: "registry.stage.redhat.io/{{ nrop_registry_ns }}"

- name: Save OCP version to artifacts
  ansible.builtin.copy:
    content: "{{ api_version.resources[0].status.desired.version }}"
    dest: "{{ manifest_dir }}/ocp_version.txt"
    mode: '0644'

- name: Label masters as worker
  kubernetes.core.k8s_json_patch:
    api_version: config.openshift.io/v1
    kind: Scheduler
    name: cluster
    patch:
      - op: replace
        path: /spec/mastersSchedulable
        value: true
  when: scheduable_master | bool and deploy_performance_profile_only | bool is false

- name: Deploy scheduler
  ansible.builtin.include_tasks: deploy_scheduler.yml

- name: Deploy performance profile
  ansible.builtin.include_tasks: preformance_profile.yml
  when:
    - nrop_config_apply_perf_profile | bool
    - not (nrop_config_operator_only | bool)

- name: Deploy Sample Device
  when:
    - deploy_performance_profile_only | bool is false
    - not (nrop_config_operator_only | bool)
  ansible.builtin.include_tasks: deploy_manifest.yml
  vars:
    template_name: "templates/{{ item }}.yaml.j2"
    manifest_name: "{{ item }}.yaml"
  loop:
    - "setup-sample-device"
    - "sample-device-A"
    - "sample-device-B"
    - "sample-device-C"
