---
# Spoke Operator Mirroring Wrapper
# Supports multiple execution modes based on operator_source field in lockdown JSON
#
# Input variables (all prefixed with telco_kpis_ to avoid upstream clashing):
#   - telco_kpis_spoke_lockdown_uri (optional) - Lockdown JSON URL
#   - telco_kpis_version (for legacy mode) - OCP version
#   - telco_kpis_architecture (for legacy mode) - CPU architecture
#   - telco_kpis_generate_lockdown (boolean) - Generate lockdown flag
#   - telco_kpis_hub_name (for lockdown generation) - Hub cluster name
#   - telco_kpis_build_number (for lockdown generation) - CI build number
#   - telco_kpis_lockdown_output_file (path for generated lockdown)
#   - operators_b64 (optional) - Base64-encoded operators JSON (for first run before lockdown exists)
#
# Execution modes (determined by operator_source field):
#   - dev-catalog: operator_source == "dev-catalog" (OCP 5.0+ dev operators)
#   - production-lockdown: operator_source == "production" or missing (default)
#   - skip-mirroring: operator_source == "skip-mirroring" (operator freeze for EC/RC testing)
#   - legacy: No lockdown URI provided (uses operators_b64 or empty list)

# ============================================================
# Phase 1: Parse Lockdown and Detect Execution Mode
# ============================================================
- name: Phase 1 - Parse Spoke Lockdown and Detect Mode
  hosts: bastion
  gather_facts: false
  tasks:
    - name: Determine operator input source
      ansible.builtin.set_fact:
        telco_kpis_has_lockdown: "{{ (telco_kpis_spoke_lockdown_uri | default('')) | length > 0 }}"
        telco_kpis_has_operators_b64: "{{ (operators_b64 | default('')) | length > 0 }}"

    - name: Parse spoke lockdown if provided
      when: telco_kpis_has_lockdown
      block:
        - name: Call lockdowns role to parse spoke lockdown
          ansible.builtin.include_role:
            name: lockdowns
          vars:
            lockdown_mode: spoke
            lockdown_action: parse
            spoke_lockdown_uri: "{{ telco_kpis_spoke_lockdown_uri }}"

    - name: Detect execution mode based on operator_source
      ansible.builtin.set_fact:
        telco_kpis_execution_mode: >-
          {{
            'legacy' if not telco_kpis_has_lockdown
            else (
              'dev-catalog' if spoke_operator_source == 'dev-catalog'
              else 'skip-mirroring' if spoke_operator_source == 'skip-mirroring'
              else 'production-lockdown'
            )
          }}
        telco_kpis_should_mirror: >-
          {{ spoke_operator_source != 'skip-mirroring' if telco_kpis_has_lockdown else true }}

    - name: Set wrapper-scoped facts for upstream playbook
      ansible.builtin.set_fact:
        telco_kpis_operators: >-
          {{
            spoke_lockdown_operators if telco_kpis_has_lockdown
            else (operators_b64 | b64decode | from_json if telco_kpis_has_operators_b64 else [])
          }}
        telco_kpis_final_version: >-
          {{ spoke_ocp_version if telco_kpis_has_lockdown else telco_kpis_version }}
        telco_kpis_final_architecture: >-
          {{ spoke_architecture if telco_kpis_has_lockdown else (telco_kpis_architecture | default('x86_64')) }}
        telco_kpis_operator_source: >-
          {{
            'lockdown' if telco_kpis_has_lockdown
            else ('direct-operators' if telco_kpis_has_operators_b64 else 'empty')
          }}

    - name: Display execution mode summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Spoke Operator Mirroring Execution Mode"
          - "=========================================="
          - "Execution Mode: {{ telco_kpis_execution_mode }}"
          - "Operator Source: {{ telco_kpis_operator_source }}"
          - "Should Mirror: {{ telco_kpis_should_mirror }}"
          - "Lockdown URI: {{ telco_kpis_spoke_lockdown_uri | default('(none)') }}"
          - "Operators Count: {{ telco_kpis_operators | length }}"
          - "OCP Version: {{ telco_kpis_final_version }}"
          - "Architecture: {{ telco_kpis_final_architecture }}"
          - "=========================================="

    - name: Display skip mirroring message
      when: not telco_kpis_should_mirror
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "SKIPPING operator mirroring (operator_source: skip-mirroring)"
          - "Operators are already mirrored and frozen for EC/RC testing"
          - "=========================================="

# ============================================================
# Phase 2: Mirror Spoke Operators
# ============================================================
# Conditional mirroring based on execution mode:
# - dev-catalog: Call upstream deploy-ocp-operators.yml (needs ART image setup)
# - production-lockdown: Call ocp_operator_mirror role directly (preserves bundle/FBC digests)
# - skip-mirroring: Skip Phase 2 entirely
# - legacy: Call ocp_operator_mirror role directly

# Phase 2a: dev-catalog mode - Call upstream playbook for ART operator handling
- name: Mirror operators using dev-catalog mode
  import_playbook: ../deploy-ocp-operators.yml
  when: hostvars['bastion']['telco_kpis_execution_mode'] == 'dev-catalog'
  vars:
    operators: "{{ hostvars['bastion']['telco_kpis_operators'] }}"
    version: "{{ hostvars['bastion']['telco_kpis_final_version'] }}"
    architecture: "{{ hostvars['bastion']['telco_kpis_final_architecture'] }}"
    kubeconfig: "{{ hostvars['bastion']['kubeconfig'] }}"
    disconnected: true
    mirror_only: true

# Phase 2b: production-lockdown/legacy mode - Call ocp_operator_mirror role directly
- name: Phase 2b - Mirror Spoke Operators (Production/Legacy)
  hosts: bastion
  gather_facts: true
  gather_subset:
    - '!all'
    - 'env'
  vars:
    # Enable lockdown feature for spoke catalog re-tagging
    telco_kpis_lockdown_feature_enabled: true
  tasks:
    - name: Normalize catalog names for production mirroring
      when:
        - telco_kpis_execution_mode in ['production-lockdown', 'legacy']
        - telco_kpis_should_mirror
      ansible.builtin.set_fact:
        _normalized_ops: >-
          {{
            _normalized_ops | default([]) + [
              item | combine({
                'catalog': item.catalog
                  | regex_replace('cs-redhat-operator.*-v.*', 'redhat-operators')
                  | regex_replace('cs-certified-operator.*-v.*', 'certified-operators')
                  | regex_replace('cs-community-operator.*-v.*', 'community-operators')
              })
            ]
          }}
      loop: "{{ telco_kpis_operators }}"

    - name: Set normalized operators variable
      when:
        - telco_kpis_execution_mode in ['production-lockdown', 'legacy']
        - telco_kpis_should_mirror
      ansible.builtin.set_fact:
        telco_kpis_normalized_operators: "{{ _normalized_ops }}"

    - name: Initialize lockdown metadata accumulator
      when: telco_kpis_generate_lockdown | default(false) | bool
      ansible.builtin.set_fact:
        lockdown_metadata_operators: {}

    - name: Mirror operators to registry (production/legacy)
      when:
        - telco_kpis_execution_mode in ['production-lockdown', 'legacy']
        - telco_kpis_should_mirror
      ansible.builtin.include_role:
        name: ocp_operator_mirror
      vars:
        ocp_operator_mirror_registry_url: "{{ disconnected_registry_url }}:{{ disconnected_registry_port }}"
        ocp_operator_mirror_registry_user: "{{ ansible_user }}"
        ocp_operator_mirror_registry_password: "{{ ansible_password }}"
        ocp_operator_mirror_pull_secret: "{{ pull_secret_string | b64decode }}"
        ocp_operator_mirror_version: "{{ telco_kpis_final_version }}"
        ocp_operator_mirror_architecture: "{{ telco_kpis_final_architecture }}"
        ocp_operator_mirror_operators: "{{ telco_kpis_normalized_operators }}"
        ocp_operator_mirror_kubeconfig: "{{ kubeconfig }}"
        ocp_operator_mirror_skip_internal_registry_cleanup: true
        ocp_operator_mirror_skip_manifest_apply: true
        ocp_operator_mirror_generate_lockdown: "{{ telco_kpis_generate_lockdown | default(false) | bool }}"
      no_log: "{{ ansible_verbosity < 3 }}"

# ============================================================
# Phase 3: Conditional Lockdown Generation
# ============================================================
- name: Phase 3 - Generate Spoke Lockdown (Conditional)
  hosts: bastion
  gather_facts: false
  tasks:
    - name: Check if lockdown generation requested
      ansible.builtin.set_fact:
        telco_kpis_should_generate: >-
          {{ (telco_kpis_generate_lockdown | default(false)) | bool }}

    - name: Handle dev-catalog lockdown generation
      when:
        - telco_kpis_should_generate
        - telco_kpis_execution_mode == 'dev-catalog'
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "WARNING: GENERATE_LOCKDOWN ignored in dev-catalog mode"
          - "Dev-catalog lockdowns are generated externally"
          - "=========================================="

    - name: Handle skip-mirroring lockdown generation
      when:
        - telco_kpis_should_generate
        - telco_kpis_execution_mode == 'skip-mirroring'
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "WARNING: GENERATE_LOCKDOWN ignored in skip-mirroring mode"
          - "Operators are frozen - no new lockdown needed"
          - "=========================================="

    - name: Generate lockdown for production/legacy modes
      when:
        - telco_kpis_should_generate
        - telco_kpis_execution_mode in ['production-lockdown', 'legacy']
      block:
        - name: Display lockdown generation info
          ansible.builtin.debug:
            msg:
              - "Generating spoke lockdown..."
              - "Output file: {{ telco_kpis_lockdown_output_file }}"
              - "Hub: {{ telco_kpis_hub_name }}"
              - "Build: {{ telco_kpis_build_number }}"

        # Generate lockdown JSON from accumulated metadata
        # Metadata was accumulated by ocp_operator_mirror role hooks in Phase 2
        - name: Generate lockdown JSON from accumulated metadata
          ansible.builtin.include_role:
            name: lockdowns
            tasks_from: spoke/generate.yml
          vars:
            lockdown_ocp_version: "{{ telco_kpis_final_version }}"
            lockdown_architecture: "{{ telco_kpis_final_architecture }}"
            lockdown_hub_name: "{{ telco_kpis_hub_name }}"
            lockdown_build_number: "{{ telco_kpis_build_number }}"
            lockdown_output_file: "{{ telco_kpis_lockdown_output_file }}"

        - name: Fetch generated spoke lockdown to controller artifact dir
          ansible.builtin.fetch:
            src: "{{ telco_kpis_lockdown_output_file }}"
            dest: "{{ lookup('env', 'ARTIFACT_DIR') | default('/artifacts', true) }}/{{ telco_kpis_lockdown_output_file | basename }}"
            flat: true
          failed_when: false

        - name: Display lockdown generation success
          ansible.builtin.debug:
            msg:
              - "=========================================="
              - "Spoke Lockdown Generated Successfully"
              - "=========================================="
              - "File: {{ telco_kpis_lockdown_output_file }}"
              - "Mode: {{ telco_kpis_execution_mode }}"
              - "=========================================="

    # Validation mode: Compare generated lockdown with input lockdown
    # This runs when BOTH lockdown URI and generation are enabled
    - name: Validate lockdown - Compare generated with input
      when:
        - telco_kpis_should_generate
        - telco_kpis_has_lockdown
        - telco_kpis_execution_mode in ['production-lockdown', 'legacy']
      block:
        - name: Download input lockdown JSON for comparison
          ansible.builtin.include_role:
            name: lockdowns
            tasks_from: common/download-lockdown.yml
          vars:
            lockdown_uri: "{{ telco_kpis_spoke_lockdown_uri }}"
            lockdown_download_path: /tmp/spoke-lockdown-input.json

        - name: Compare lockdown files using jd or jq
          ansible.builtin.shell: |
            set -o pipefail

            if command -v jd &> /dev/null; then
              echo "Using jd for JSON comparison"
              jd -set /tmp/spoke-lockdown-input.json {{ telco_kpis_lockdown_output_file }}
            elif command -v jq &> /dev/null; then
              echo "Using jq for JSON comparison"
              echo "=== Input Lockdown (from {{ telco_kpis_spoke_lockdown_uri }}) ==="
              jq -S . /tmp/spoke-lockdown-input.json > /tmp/input-sorted.json
              echo "=== Generated Lockdown ==="
              jq -S . {{ telco_kpis_lockdown_output_file }} > /tmp/generated-sorted.json
              diff -u /tmp/input-sorted.json /tmp/generated-sorted.json || true
            else
              echo "ERROR: Neither jd nor jq available for comparison"
              exit 1
            fi
          args:
            executable: /bin/bash
          register: lockdown_diff
          changed_when: false
          failed_when: false

        - name: Normalize input lockdown (exclude metadata section)
          ansible.builtin.command: |
            jq -S 'del(.metadata)' /tmp/spoke-lockdown-input.json
          register: input_normalized
          changed_when: false

        - name: Normalize generated lockdown (exclude metadata section)
          ansible.builtin.command: |
            jq -S 'del(.metadata)' {{ telco_kpis_lockdown_output_file }}
          register: generated_normalized
          changed_when: false

        - name: Normalize catalog names in input operators (for comparison)
          ansible.builtin.shell: |
            set -o pipefail
            jq -S '.operators | map(
              .catalog |= (
                gsub("cs-redhat-operator-index-v.*"; "redhat-operators") |
                gsub("cs-certified-operator-index-v.*"; "certified-operators") |
                gsub("cs-community-operator-index-v.*"; "community-operators")
              )
            )' /tmp/spoke-lockdown-input.json
          register: input_operators_normalized
          changed_when: false

        - name: Extract generated operators (already normalized)
          ansible.builtin.command: |
            jq -S '.operators' {{ telco_kpis_lockdown_output_file }}
          register: generated_operators
          changed_when: false

        - name: Extract bundle+fbc digests from input operators
          ansible.builtin.command: |
            jq -S '[.operators[] | {name, bundle, fbc}]' /tmp/spoke-lockdown-input.json
          register: input_critical_fields
          changed_when: false

        - name: Extract bundle+fbc digests from generated operators
          ansible.builtin.command: |
            jq -S '[.operators[] | {name, bundle, fbc}]' {{ telco_kpis_lockdown_output_file }}
          register: generated_critical_fields
          changed_when: false

        - name: Set comparison results
          ansible.builtin.set_fact:
            operators_match: "{{ input_operators_normalized.stdout == generated_operators.stdout }}"
            critical_fields_match: "{{ input_critical_fields.stdout == generated_critical_fields.stdout }}"

        - name: Display comparison results
          ansible.builtin.debug:
            msg:
              - "=========================================="
              - "Spoke Lockdown Validation (Comparison)"
              - "=========================================="
              - "Input Lockdown: {{ telco_kpis_spoke_lockdown_uri }}"
              - "Generated Lockdown: {{ telco_kpis_lockdown_output_file }}"
              - "Bundle/FBC Digests: {{ '✓ IDENTICAL' if critical_fields_match else '✗ DIFFERENT' }}"
              - "Full Operators: {{ '✓ IDENTICAL' if operators_match else '⚠ DIFFERENT (non-critical)' }}"
              - "=========================================="

        - name: Display diff output if different
          ansible.builtin.debug:
            msg: "{{ lockdown_diff.stdout_lines }}"
          when: not operators_match

        - name: Save diff to artifacts
          ansible.builtin.copy:
            content: "{{ lockdown_diff.stdout }}"
            dest: "{{ telco_kpis_lockdown_output_file | dirname }}/spoke-lockdown-diff.txt"
            mode: '0644'
          when: not operators_match

        - name: Warn about non-critical differences
          ansible.builtin.debug:
            msg: |
              WARNING: Non-critical differences detected between input and generated lockdowns.
              Bundle and FBC digests are identical — mirroring is consistent.
              Differences are in other fields (e.g. catalog names, default_channel).
              Review the diff output above for details.
          when:
            - not operators_match
            - critical_fields_match

        - name: Fail if bundle or fbc digests don't match
          ansible.builtin.fail:
            msg: |
              VALIDATION FAILED: Bundle/FBC digest mismatch detected!

              Generated lockdown has DIFFERENT bundle or FBC digests than the input lockdown.
              This is CRITICAL because spoke operators must have identical digests
              for consistent deployments across ZTP spoke clusters.

              Review the diff output above to identify which operators changed.

              Common causes:
                - Operator bundle digests changed upstream
                - FBC catalog digests changed
                - Different operator versions selected

              Input: {{ telco_kpis_spoke_lockdown_uri }}
              Generated: {{ telco_kpis_lockdown_output_file }}
              Diff saved to: {{ lookup('env', 'ARTIFACT_DIR') | default('/artifacts', true) }}/spoke-lockdown-diff.txt
          when: not critical_fields_match
      always:
        # Fetch the diff regardless of comparison result
        - name: Fetch spoke lockdown diff to controller artifact dir
          ansible.builtin.fetch:
            src: "{{ telco_kpis_lockdown_output_file | dirname }}/spoke-lockdown-diff.txt"
            dest: "{{ lookup('env', 'ARTIFACT_DIR') | default('/artifacts', true) }}/spoke-lockdown-diff.txt"
            flat: true
          failed_when: false
