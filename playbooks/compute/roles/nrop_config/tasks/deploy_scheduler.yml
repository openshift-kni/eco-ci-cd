---
- name: Get scheduler configuration
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Scheduler
    name: cluster
  register: scheduler_info

- name: Set NROP target pool and base image
  ansible.builtin.set_fact:
    nrop_target_pool: "{{ 'master' if scheduler_info.resources[0].spec.mastersSchedulable | default(false) else 'worker' }}"
    base_image: "{% if ocp_version_minor == 12 %}rhel8{% else %}rhel9{% endif %}"

- name: Check if it's full schedulable cluster
  when: nrop_target_pool == 'master'
  block:
    - name: Get Nodes information
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: nodes_info

    - name: Check if it's full schedulable cluster
      ansible.builtin.set_fact:
        is_full_schedulable_cluster: true
      when: nodes_info.resources | length >= 4

- name: Print target pool
  ansible.builtin.debug:
    msg: "Target pool: {{ nrop_target_pool }}"

- name: Disable scheduler validation
  when: custom_scheduler is defined
  kubernetes.core.k8s_json_patch:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: numaresources-operator
    namespace: openshift-numaresources
    patch:
      - op: add
        path: /spec/config/env
        value:
          - name: SCHEDULER_IMAGE_VALIDATION
            value: "false"

- name: Set scheduler
  when: custom_scheduler is not defined
  block:
    - name: Set scheduler image uri
      ansible.builtin.set_fact:
        scheduler_image_version: "{{ image_uri[test_env] }}/{{ scheduler_image_name }}-{{ base_image }}:v{{ ocp_version_major }}.{{ ocp_version_minor }}"

    - name: Save pull secret
      ansible.builtin.copy:
        content: "{{ pull_secret_string | b64decode }}"
        dest: /tmp/pull_secret
        mode: '0660'

    - name: Get scheduler sha256
      ansible.builtin.command: >-
        skopeo --override-os linux --override-arch amd64 inspect
        --authfile /tmp/pull_secret
        --format {{ (scheduler_image_version.split(':')[0] ~ '@{{.Digest}}') | quote }}
        docker://{{ scheduler_image_version }}
      register: scheduler_image_sha
      changed_when: false

    - name: Patch Subscription with image digests
      kubernetes.core.k8s_json_patch:
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: numaresources-operator
        namespace: openshift-numaresources
        patch:
          - op: add
            path: /spec/config/env
            value:
              - name: SCHEDULER_IMAGE_DIGESTS
                value: "{{ scheduler_image_sha.stdout.split('@')[1] }}"

- name: Set image name
  ansible.builtin.set_fact:
    scheduler_image_uri: "{{ scheduler_image_sha.stdout }}"

- name: Overwrite scheduler image uri
  ansible.builtin.set_fact:
    scheduler_image_uri: "{{ custom_scheduler }}"
  when: custom_scheduler is defined

- name: Print scheduler image uri
  ansible.builtin.debug:
    msg: "Scheduler image uri: {{ scheduler_image_uri }}"

- name: Deploy scheduler manifest
  ansible.builtin.include_tasks: deploy_manifest.yml
  vars:
    template_name: "templates/scheduler.yaml.j2"
    manifest_name: "operator-scheduler.yaml"
  when: deploy_performance_profile_only | bool is false

- name: Wait for MCP restart
  ansible.builtin.include_tasks: wait_for_mcp.yml
  when: (ocp_version_major ~ '.' ~ ocp_version_minor) is version('4.18', '<')
