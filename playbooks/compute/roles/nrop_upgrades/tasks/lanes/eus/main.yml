---
- name: Check the first Cincinnati hop
  ansible.builtin.include_tasks: preflight_eus.yml
  when: ocp_control_plane_hops | length > 0

- name: Install NROP at lane start version
  ansible.builtin.include_tasks: install_nrop.yml
  vars:
    nrop_catalog_source: "{{ nrop_env_from }}"
    nrop_operator_version: "{{ install_nrop_version }}"
    nrop_artifact_phase: install

- name: Discover EUS workers for topology and smoke checks
  when:
    - cluster_ocp_version == '4.20'
    - target_ocp_version == '4.22'
    - apply_perf_profile | bool
  block:
    - name: Read worker nodes
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
        label_selectors:
          - node-role.kubernetes.io/worker
      register: nrop_eus_workers

    - name: Require worker nodes
      ansible.builtin.assert:
        that:
          - nrop_eus_workers.resources | length > 0

    - name: Record worker names
      ansible.builtin.set_fact:
        nrop_canary_worker_names: "{{ nrop_eus_workers.resources | map(attribute='metadata.name') | list }}"

- name: Verify the EUS baseline
  ansible.builtin.include_tasks: verify_eus_canary_baseline.yml

- name: Copy EUS script to the bastion
  ansible.builtin.copy:
    src: "{{ role_path }}/scripts/nrop-eus-upgrade.sh"
    dest: /tmp/nrop-eus-upgrade.sh
    mode: '0755'

- name: EUS setup
  ansible.builtin.command:
    cmd: /tmp/nrop-eus-upgrade.sh setup
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
    OCP_TARGET_VERSION: "{{ target_ocp_version }}"
    OCP_FROM_MINOR: "{{ ocp_from_minor }}"
    ARTIFACTS_DIR: "{{ artifacts_folder }}"
  changed_when: true

- name: Upgrade NROP before control-plane OCP hops
  ansible.builtin.include_tasks: install_nrop.yml
  vars:
    nrop_catalog_source: "{{ nrop_env_to }}"
    nrop_operator_version: "{{ target_ocp_version }}"
    nrop_artifact_phase: upgrade

- name: Upgrade the EUS control plane
  block:
    - name: Control-plane OCP hops
      ansible.builtin.include_tasks: upgrade_ocp.yml
      loop: "{{ ocp_control_plane_hops }}"
      loop_control:
        loop_var: nrop_hop_version
  rescue:
    - name: Report the paused EUS state
      ansible.builtin.fail:
        msg: >-
          An EUS OCP hop failed. The worker MCP and NROP reconciliation may remain paused;
          no automatic unpause was attempted. Inspect the cluster before recovery.
          {{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default('See the earlier failure'), true) }}

- name: EUS unpause workers
  ansible.builtin.command:
    cmd: /tmp/nrop-eus-upgrade.sh unpause
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
    OCP_TARGET_VERSION: "{{ target_ocp_version }}"
    OCP_FROM_MINOR: "{{ ocp_from_minor }}"
    ARTIFACTS_DIR: "{{ artifacts_folder }}"
  changed_when: true

- name: Verify EUS worker topology after the upgrade
  ansible.builtin.include_tasks: verify_canary_topology.yml
  when:
    - cluster_ocp_version == '4.20'
    - target_ocp_version == '4.22'
    - apply_perf_profile | bool

- name: Run the post-upgrade EUS smoke test
  ansible.builtin.include_tasks: verify_canary_smoke.yml
  vars:
    nrop_canary_smoke_phase: post
    nrop_canary_smoke_pool: worker
  when:
    - cluster_ocp_version == '4.20'
    - target_ocp_version == '4.22'
    - apply_perf_profile | bool
