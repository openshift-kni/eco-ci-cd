---
# An over-age stable candidate on the 5.0 release stream is dynamically
# classified as nightly.
ocp_version_facts_release: "5.0"
ocp_version_release_age_max_days: 100
ocp_version_facts_query:
  name: "5.0.1"
  pullSpec: "quay.io/openshift-release-dev/ocp-release:5.0.1-x86_64"
  downloadURL: >-
    https://mirror.openshift.com/pub/openshift-v5/x86_64/clients/ocp/5.0.1
image_age_days: 101

expected_facts:
  ocp_version_facts_parsed_release: "5.0.1"
  ocp_version_facts_major: "5"
  ocp_version_facts_minor: "0"
  ocp_version_facts_z_stream: "1"
  ocp_version_facts_release_type: "nightly"

expected_undefined_facts:
  - ocp_version_facts_dev_version
