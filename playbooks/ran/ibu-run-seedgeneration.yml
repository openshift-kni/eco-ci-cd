---
# Run eco-gotests seedgeneration with pull-secret backup/restore.
#
# LCA seedgeneration sterilizes openshift-config/pull-secret; in disconnected
# Prow that degrades master MCP. This playbook:
#   1. Backs up pull-secret.data['.dockerconfigjson'] (already base64)
#   2. Runs the pre-generated eco-gotests script
#   3. Always restores the pull secret and waits for master MCP
#   4. Verifies SeedGenerator reached SeedGenCompleted=True
#
# Generate the script first with deploy-run-eco-gotests.yaml.
#
# Success tracking (after MCP is healthy):
#   SeedGenerator CR has condition SeedGenCompleted=True (reason Completed).
#   JUnit under {{ eco_gotest_dir }}/report/ is still collected by Prow.
#
# Usage:
#   ansible-playbook playbooks/ran/ibu-run-seedgeneration.yml \
#     -i inventories/cnf/switch-config.yaml \
#     --extra-vars 'spoke_cluster=ibu-seed'
#
# Required: spoke_cluster
# Optional: kubeconfig, eco_gotest_dir, script_name,
#           ibu_seedgeneration_cr_name (default: seedimage),
#           ibu_seedgeneration_wait_mcp (default true),
#           ibu_seedgeneration_async_timeout (default 43200)

- name: Run seedgeneration with pull-secret backup/restore
  hosts: bastion
  gather_facts: false
  vars:
    kubeconfig: "/tmp/{{ spoke_cluster }}-kubeconfig"
    eco_gotest_dir: /tmp/eco_gotests
    script_name: eco-gotests-run.sh
    ibu_seedgeneration_cr_name: seedimage
    ibu_seedgeneration_wait_mcp: true
    ibu_seedgeneration_async_timeout: 43200
    ibu_seedgeneration_poll_interval: 60
    ibu_seedgeneration_mcp_retries: 60
    ibu_seedgeneration_mcp_delay: 30
  tasks:
    - name: Assert required variables are defined
      ansible.builtin.assert:
        that:
          - spoke_cluster is defined
          - spoke_cluster | length > 0
        fail_msg: spoke_cluster must be provided as an extra-var

    - name: Assert spoke kubeconfig and eco-gotests script exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _ibu_seedgen_paths
      loop:
        - "{{ kubeconfig }}"
        - "{{ eco_gotest_dir }}/{{ script_name }}"

    - name: Fail when required paths are missing
      ansible.builtin.assert:
        that:
          - _ibu_seedgen_paths.results[0].stat.exists
          - _ibu_seedgen_paths.results[1].stat.exists
        fail_msg: >-
          Need spoke kubeconfig at {{ kubeconfig }} and generated script at
          {{ eco_gotest_dir }}/{{ script_name }}.
          Run ibu-prepare-spoke-sno.yml and deploy-run-eco-gotests.yaml first.

    - name: Get spoke pull secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: openshift-config
        name: pull-secret
      register: _ibu_seedgen_ps
      no_log: true

    - name: Assert pull secret data is present
      ansible.builtin.assert:
        that:
          - _ibu_seedgen_ps.resources | length > 0
          - >-
            _ibu_seedgen_ps.resources[0].data['.dockerconfigjson']
            is defined
          - >-
            _ibu_seedgen_ps.resources[0].data['.dockerconfigjson']
            | length > 0
        fail_msg: >-
          openshift-config/pull-secret missing or empty; cannot backup/restore.
      no_log: true

    - name: Backup pull-secret dockerconfigjson (base64 as stored by k8s)
      ansible.builtin.set_fact:
        _ibu_seedgen_ps_b64: >-
          {{ _ibu_seedgen_ps.resources[0].data['.dockerconfigjson'] }}
      no_log: true

    - name: Run seedgeneration and always restore pull secret
      block:
        - name: Make eco-gotests script safe without a TTY
          ansible.builtin.replace:
            path: "{{ eco_gotest_dir }}/{{ script_name }}"
            regexp: 'podman run -it'
            replace: 'podman run -i'

        - name: Execute eco-gotests seedgeneration script
          ansible.builtin.command:
            cmd: "./{{ script_name }}"
            chdir: "{{ eco_gotest_dir }}"
          async: "{{ ibu_seedgeneration_async_timeout | int }}"
          poll: "{{ ibu_seedgeneration_poll_interval | int }}"
          register: _ibu_seedgen_run
          failed_when: false
          changed_when: true

      always:
        - name: Restore spoke openshift-config/pull-secret
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig }}"
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: pull-secret
                namespace: openshift-config
              type: kubernetes.io/dockerconfigjson
              data:
                .dockerconfigjson: "{{ _ibu_seedgen_ps_b64 }}"
          no_log: true

        - name: Wait for master MCP after pull-secret restore
          when: ibu_seedgeneration_wait_mcp | bool
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig }}"
            api_version: machineconfiguration.openshift.io/v1
            kind: MachineConfigPool
            name: master
          register: _ibu_seedgen_mcp
          retries: "{{ ibu_seedgeneration_mcp_retries | int }}"
          delay: "{{ ibu_seedgeneration_mcp_delay | int }}"
          until:
            - _ibu_seedgen_mcp.resources | length > 0
            - >-
              (_ibu_seedgen_mcp.resources[0].status.conditions
               | selectattr('type', 'equalto', 'Updated')
               | map(attribute='status') | first | default('False'))
              == 'True'
            - >-
              (_ibu_seedgen_mcp.resources[0].status.conditions
               | selectattr('type', 'equalto', 'Degraded')
               | map(attribute='status') | first | default('True'))
              == 'False'
            - >-
              (_ibu_seedgen_mcp.resources[0].status.readyMachineCount
               | default(0) | int)
              == (_ibu_seedgen_mcp.resources[0].status.machineCount
                  | default(0) | int)

    - name: Get SeedGenerator status after MCP recovery
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: lca.openshift.io/v1
        kind: SeedGenerator
        name: "{{ ibu_seedgeneration_cr_name }}"
      register: _ibu_seedgen_cr

    - name: Assert SeedGenerator CR exists
      ansible.builtin.assert:
        that:
          - _ibu_seedgen_cr.resources | length > 0
        fail_msg: >-
          SeedGenerator/{{ ibu_seedgeneration_cr_name }} not found after
          seedgeneration (eco-gotests rc={{
            _ibu_seedgen_run.rc | default('unknown')
          }}).

    - name: Set SeedGenerator conditions fact
      ansible.builtin.set_fact:
        _ibu_seedgen_conds: "{{ _ibu_seedgen_cr.resources[0].status.conditions | default([]) }}"  # noqa: yaml[line-length]

    - name: Assert SeedGenerator completed successfully
      ansible.builtin.assert:
        that:
          - >-
            (_ibu_seedgen_conds
             | selectattr('type', 'equalto', 'SeedGenCompleted')
             | map(attribute='status') | first | default('False')) == 'True'
          - >-
            (_ibu_seedgen_conds
             | selectattr('type', 'equalto', 'SeedGenCompleted')
             | map(attribute='reason') | first | default('')) == 'Completed'
          - >-
            (_ibu_seedgen_conds
             | selectattr('type', 'equalto', 'SeedGenInProgress')
             | map(attribute='status') | first | default('True')) == 'False'
        fail_msg: >-
          SeedGenerator/{{ ibu_seedgeneration_cr_name }} did not complete.
          Expected SeedGenCompleted=True (reason Completed) and
          SeedGenInProgress=False.
          conditions={{ _ibu_seedgen_conds | to_json }}
