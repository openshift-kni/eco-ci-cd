---
# Parse OSLAT test metrics from podman-run.log
# Sets: _tkdp_test_specific_data with oslat metrics

- name: Read podman-run.log
  ansible.builtin.slurp:
    src: "{{ _tkdp_current_test_dir }}/podman-run.log"
  register: _tkdp_oslat_log
  failed_when: false

- name: Parse OSLAT metrics from log
  when: _tkdp_oslat_log.content is defined
  block:
    - name: Decode log content
      ansible.builtin.set_fact:
        _tkdp_oslat_log_text: "{{ _tkdp_oslat_log.content | b64decode }}"

    - name: Extract core list
      ansible.builtin.set_fact:
        _tkdp_oslat_cores_line: "{{ _tkdp_oslat_log_text | regex_search('Core:\\s+(.+)', '\\1') }}"

    - name: Extract maximum latencies line
      ansible.builtin.set_fact:
        _tkdp_oslat_max_line: "{{ _tkdp_oslat_log_text | regex_search('Maximum:\\s+(.+)\\(us\\)', '\\1') }}"

    - name: Extract minimum latencies line
      ansible.builtin.set_fact:
        _tkdp_oslat_min_line: "{{ _tkdp_oslat_log_text | regex_search('Minimum:\\s+(.+)\\(us\\)', '\\1') }}"

    - name: Extract average latencies line
      ansible.builtin.set_fact:
        _tkdp_oslat_avg_line: "{{ _tkdp_oslat_log_text | regex_search('Average:\\s+(.+)\\(us\\)', '\\1') }}"

    - name: Extract total runtime
      ansible.builtin.set_fact:
        _tkdp_oslat_runtime: "{{ (_tkdp_oslat_log_text | regex_search('Total runtime:\\s+(\\d+)', '\\1') | default(['60'], true) | first) }}"

    - name: Parse cores into list
      ansible.builtin.set_fact:
        _tkdp_oslat_cores: "{{ (_tkdp_oslat_cores_line | default([''], true) | first).split() }}"

    - name: Parse max latencies into list
      ansible.builtin.set_fact:
        _tkdp_oslat_max_values: "{{ (_tkdp_oslat_max_line | default([''], true) | first).split() }}"

    - name: Parse min latencies into list
      ansible.builtin.set_fact:
        _tkdp_oslat_min_values: "{{ (_tkdp_oslat_min_line | default([''], true) | first).split() }}"

    - name: Parse avg latencies into list
      ansible.builtin.set_fact:
        _tkdp_oslat_avg_values: "{{ (_tkdp_oslat_avg_line | default([''], true) | first).split() }}"

    - name: Calculate overall max latency
      ansible.builtin.set_fact:
        _tkdp_oslat_overall_max: "{{ _tkdp_oslat_max_values | map('int') | max | default(0) }}"

    - name: Compute per-core availability from histogram
      ansible.builtin.shell: |
        python3 -c "
        import json, re, sys
        log = sys.stdin.read()
        threshold = 20
        num_cores = {{ _tkdp_oslat_cores | length }}
        histogram = {}
        for m in re.finditer(r'^\s+(\d+)\s+\(us\):\s+(.+?)(?:\s+\(including overflows\))?$', log, re.MULTILINE):
            bucket = int(m.group(1))
            counts = m.group(2).split()
            for i, c in enumerate(counts[:num_cores]):
                histogram.setdefault(i, {})[bucket] = int(c)
        results = []
        for i in range(num_cores):
            h = histogram.get(i, {})
            total = sum(h.values())
            above = sum(v for k, v in h.items() if k > threshold)
            if total > 0:
                avail = (total - above) / total * 100.0
            else:
                avail = 100.0
            avail_str = f'{avail:.10f}'
            nines = 0
            dot_seen = False
            for ch in avail_str:
                if ch == '.':
                    dot_seen = True
                    continue
                if not dot_seen:
                    continue
                if ch == '9':
                    nines += 1
                else:
                    break
            if avail == 100.0:
                nines = 100
            results.append({'availability': round(avail, 10), 'number_of_nines': nines})
        print(json.dumps(results))
        "
      args:
        stdin: "{{ _tkdp_oslat_log_text }}"
      register: _tkdp_oslat_availability_result
      changed_when: false
      failed_when: false

    - name: Parse availability results
      ansible.builtin.set_fact:
        _tkdp_oslat_availability_data: "{{ _tkdp_oslat_availability_result.stdout | default('[]') | from_json }}"

    - name: Calculate overall availability
      ansible.builtin.set_fact:
        _tkdp_oslat_availability: >-
          {{ (_tkdp_oslat_availability_data | map(attribute='availability') | min | default(100.0)) | string }}

    - name: Build per-core results (test_units format for Splunk dashboard)
      ansible.builtin.set_fact:
        _tkdp_oslat_test_units: >-
          {{ _tkdp_oslat_test_units | default([]) + [{
            'index': _tkdp_oslat_cores[item] | string,
            'max_latency': _tkdp_oslat_max_values[item] | int,
            'min_latency': (_tkdp_oslat_min_values[item] | default('0')) | int,
            'avg_latency': (_tkdp_oslat_avg_values[item] | default('0')) | float,
            'availability': (_tkdp_oslat_availability_data[item] | default({'availability': 100.0})).availability,
            'number_of_nines': (_tkdp_oslat_availability_data[item] | default({'number_of_nines': 100})).number_of_nines
          }] }}
      loop: "{{ range(0, _tkdp_oslat_cores | length) | list }}"
      when: _tkdp_oslat_cores | length > 0 and _tkdp_oslat_max_values | length > 0

    - name: Set oslat-specific data for Splunk (matches splunk_kpis_reporter schema)
      ansible.builtin.set_fact:
        _tkdp_test_specific_data:
          duration: "{{ _tkdp_oslat_runtime | int }}"
          test_units: "{{ _tkdp_oslat_test_units | default([]) }}"
          max_latency: "{{ _tkdp_oslat_overall_max }}"
          availability: "{{ _tkdp_oslat_availability }}"
          cores: "{{ _tkdp_oslat_cores | join(', ') }}"

  rescue:
    - name: Log oslat parse error
      ansible.builtin.debug:
        msg: "WARNING: Failed to parse oslat metrics from podman-run.log"

    - name: Set empty oslat data on error
      ansible.builtin.set_fact:
        _tkdp_test_specific_data: {}

- name: Handle missing oslat log
  when: _tkdp_oslat_log.content is not defined
  ansible.builtin.set_fact:
    _tkdp_test_specific_data: {}
