---
# Publish test report and artifacts to Gitea repository

- name: Set report publication variables
  ansible.builtin.set_fact:
    report_date: "{{ ansible_date_time.date }}"
    report_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
    git_work_dir: "/tmp/gitea-publish-{{ ansible_date_time.epoch }}"
    report_dir_name: "{{ ansible_date_time.date }}"

- name: Set report base directory (root for dev-bastion, reports/ for prod and dev-hypervisor)
  ansible.builtin.set_fact:
    _reports_dir: "{{ git_work_dir }}{{ '' if report_publish_mode | default('prod') == 'dev-bastion' else '/reports' }}"

- name: Display publication info
  ansible.builtin.debug:
    msg:
      - "Publishing report: {{ report_file }}"
      - "Artifacts tarball: {{ report_tarball }}"
      - "Spoke cluster: {{ spoke_cluster }}"
      - "Report date: {{ report_date }}"
      - "Report action: {{ report_action | default('update') | upper }}"
      - "{{ 'Creating NEW report (environment changed)' if report_action == 'new' else 'Updating EXISTING report (environment stable)' }}"

# Failed/aborted builds skip the final cleanup and can leave multi-GB clones
# in /tmp. Prune anything older than 6h (concurrent builds are minutes old).
- name: Find stale report work directories
  ansible.builtin.find:
    paths: /tmp
    patterns:
      - "gitea-publish-*"
      - "report-repo-verify-*"
      - "report-freshness-check-*"
    file_type: directory
    age: 6h
  register: _stale_work_dirs
  changed_when: false

- name: Remove stale report work directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _stale_work_dirs.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Remove pre-existing temporary work directory if exists
  ansible.builtin.file:
    path: "{{ git_work_dir }}"
    state: absent

- name: Create temporary work directory
  ansible.builtin.file:
    path: "{{ git_work_dir }}"
    state: directory
    mode: '0755'

- name: Clone report branch
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "Cloninig branch: {{ report_repo_branch }}"
      - "=========================================="

# The branch tip is several GB of report logs (hundreds of MB even packed), so
# a regular clone downloads every blob. Publishing only reads the report index
# sidecars and the README; everything else is written locally or removed/added
# via the index. A partial + sparse clone keeps the transfer to a few hundred KB.
- name: Clone repository (partial and sparse)
  ansible.builtin.command:
    argv:
      - git
      - clone
      - --depth=1
      - --single-branch
      - --branch={{ report_repo_branch }}
      - --filter=blob:none
      - --sparse
      - "{{ gitea_repo_http_url }}"
      - "{{ git_work_dir }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
  no_log: "{{ ansible_verbosity < 3 }}"
  changed_when: true

- name: Check out only report indexes and README (sparse)
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ git_work_dir }}"
      - sparse-checkout
      - set
      - --no-cone
      - /README.md
      - /reports/README.md
      - /reports/*/*/report-index.json
  changed_when: true

- name: Handle report update (remove existing report for today)
  when: report_action | default('update') == 'update'
  block:
    # Sparse checkout keeps today's artifacts off-disk, so drop the old report
    # directory from the index directly (this run replaces it).
    - name: Remove today's report from the git index
      ansible.builtin.shell: |
        set -o pipefail
        git ls-files -z -- '{{ _reports_dir | relpath(git_work_dir) }}/{{ report_dir_name }}/{{ spoke_cluster }}' \
          | git update-index --force-remove -z --stdin
      args:
        chdir: "{{ git_work_dir }}"
        executable: /bin/bash
      changed_when: true

    - name: Check if today's report directory exists
      ansible.builtin.stat:
        path: "{{ _reports_dir }}/{{ report_dir_name }}/{{ spoke_cluster }}"
      register: today_report_dir

    - name: Find existing reports for today
      ansible.builtin.find:
        paths: "{{ _reports_dir }}/{{ report_dir_name }}/{{ spoke_cluster }}"
        patterns: "telco-kpis-report-{{ spoke_cluster }}-*.md"
      register: existing_reports
      when: today_report_dir.stat.exists and today_report_dir.stat.isdir

    - name: Remove existing report files (update mode)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ existing_reports.files }}"
      when:
        - existing_reports is defined
        - existing_reports.files is defined
        - existing_reports.files | length > 0

    - name: Display update action message
      ansible.builtin.debug:
        msg: >-
          {% if existing_reports is defined and
                existing_reports.files is defined and
                existing_reports.files | length > 0 %}
          Removed {{ existing_reports.files | length }} existing report(s) for update
          {% else %}
          No existing reports to remove
          {% endif %}
      when: existing_reports is defined

- name: Display new report action message
  ansible.builtin.debug:
    msg: "Creating new report (environment configuration changed - keeping all historical reports)"
  when: report_action | default('update') == 'new'

- name: Apply retention policy to Gitea repository
  when: gitea_report_retention_days is defined and gitea_report_retention_days | int > 0
  block:
    - name: Find all date directories in reports
      ansible.builtin.find:
        paths: "{{ _reports_dir }}"
        file_type: directory
        recurse: false
        patterns: "????-??-??"
      register: date_directories

    - name: Sort date directories and identify old ones for deletion
      ansible.builtin.set_fact:
        sorted_dates: "{{ date_directories.files | map(attribute='path') | map('basename') | sort | reverse | list }}"

    - name: Determine directories to delete (keep only last N days)
      ansible.builtin.set_fact:
        dirs_to_delete: "{{ sorted_dates[gitea_report_retention_days | int :] }}"

    - name: Display retention policy info
      ansible.builtin.debug:
        msg:
          - "Retention policy: Keep last {{ gitea_report_retention_days }} days"
          - "Total date directories: {{ sorted_dates | length }}"
          - "Directories to keep: {{ sorted_dates[: gitea_report_retention_days | int] | join(', ') }}"
          - "Directories to delete: {{ dirs_to_delete | join(', ') if dirs_to_delete | length > 0 else 'None' }}"

    - name: Remove old report directories beyond retention period
      ansible.builtin.file:
        path: "{{ _reports_dir }}/{{ item }}"
        state: absent
      loop: "{{ dirs_to_delete }}"
      when: dirs_to_delete | length > 0

- name: Create report directory structure
  ansible.builtin.file:
    path: "{{ _reports_dir }}/{{ report_dir_name }}/{{ spoke_cluster }}"
    state: directory
    mode: '0755'

- name: Copy report markdown file
  ansible.builtin.copy:
    src: "{{ lookup('env', 'ARTIFACT_DIR') | default('/artifacts', true) }}/reports/{{ report_file }}"
    dest: "{{ _reports_dir }}/{{ report_dir_name }}/{{ spoke_cluster }}/{{ report_file }}"
    mode: '0644'

- name: Copy report index sidecar
  ansible.builtin.copy:
    src: "{{ lookup('env', 'ARTIFACT_DIR') | default('/artifacts', true) }}/reports/report-index.json"
    dest: "{{ _reports_dir }}/{{ report_dir_name }}/{{ spoke_cluster }}/report-index.json"
    mode: '0644'
  failed_when: false

- name: Extract artifacts tarball
  ansible.builtin.unarchive:
    src: "{{ lookup('env', 'ARTIFACT_DIR') | default('/artifacts', true) }}/reports/{{ report_tarball }}"
    dest: "{{ _reports_dir }}/{{ report_dir_name }}/{{ spoke_cluster }}/"
    remote_src: false

- name: Find extracted artifact directories
  ansible.builtin.find:
    paths: "{{ _reports_dir }}/{{ report_dir_name }}/{{ spoke_cluster }}"
    file_type: directory
    patterns: "*-{{ spoke_cluster }}-*"
  register: artifact_dirs

- name: Deduplicate artifact directories (keep only latest per test)
  when: artifact_dirs.files | length > 0
  block:
    - name: Parse artifact directory names to extract test names and timestamps
      ansible.builtin.set_fact:
        parsed_artifacts: >-
          {{
            parsed_artifacts | default([]) +
            [{
              'path': item.path,
              'basename': item.path | basename,
              'test_name': (item.path | basename | regex_replace('^(.+)-' + spoke_cluster + '-[0-9]{8}-[0-9]{6}$', '\1')),
              'timestamp': (item.path | basename | regex_replace('^.+-' + spoke_cluster + '-([0-9]{8}-[0-9]{6})$', '\1'))
            }]
          }}
      loop: "{{ artifact_dirs.files }}"
      when: item.path | basename | regex_search('^.+-' + spoke_cluster + '-[0-9]{8}-[0-9]{6}$')

    - name: Display parsed artifacts for debugging
      ansible.builtin.debug:
        msg: "Parsed artifacts: {{ parsed_artifacts | default([]) }}"

    - name: Group artifacts by test name and find latest timestamp for each
      ansible.builtin.set_fact:
        latest_artifacts: >-
          {{
            latest_artifacts | default({}) | combine({
              item.test_name: (
                latest_artifacts[item.test_name] | default({'timestamp': '00000000-000000'})
                if (latest_artifacts[item.test_name] | default({'timestamp': '00000000-000000'})).timestamp > item.timestamp
                else item
              )
            })
          }}
      loop: "{{ parsed_artifacts | default([]) }}"

    - name: Display latest artifacts mapping for debugging
      ansible.builtin.debug:
        msg: "Latest artifacts to rename: {{ latest_artifacts | default({}) }}"

    - name: Identify directories to delete (older than latest per test)
      ansible.builtin.set_fact:
        dirs_to_delete: >-
          {{
            dirs_to_delete | default([]) +
            [item.path]
          }}
      loop: "{{ parsed_artifacts | default([]) }}"
      when: >-
        latest_artifacts[item.test_name] is defined and
        item.timestamp != latest_artifacts[item.test_name].timestamp

    - name: Delete older artifact directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ dirs_to_delete | default([]) }}"

    - name: Rename latest artifact directories to remove timestamps
      ansible.builtin.command:
        cmd: >-
          mv "{{ item.value.basename }}" "{{ item.key }}"
        chdir: "{{ _reports_dir }}/{{ report_dir_name }}/{{ spoke_cluster }}"
      loop: "{{ latest_artifacts | dict2items }}"
      when: >-
        item.value.basename != item.key
      register: rename_result
      changed_when: rename_result.rc == 0
      failed_when: false

    - name: Remove pre-existing target directories before rename (if rename failed)
      ansible.builtin.file:
        path: "{{ _reports_dir }}/{{ report_dir_name }}/{{ spoke_cluster }}/{{ item.key }}"
        state: absent
      loop: "{{ latest_artifacts | dict2items }}"
      when: >-
        item.value.basename != item.key and
        rename_result.results[loop.index0].rc | default(0) != 0

    - name: Retry rename after cleanup
      ansible.builtin.command:
        cmd: >-
          mv "{{ item.value.basename }}" "{{ item.key }}"
        chdir: "{{ _reports_dir }}/{{ report_dir_name }}/{{ spoke_cluster }}"
      loop: "{{ latest_artifacts | dict2items }}"
      when: >-
        item.value.basename != item.key and
        rename_result.results[loop.index0].rc | default(0) != 0
      changed_when: true

- name: Generate initial README.md index
  ansible.builtin.include_tasks: generate-readme.yml

- name: Configure git user  # noqa: command-instead-of-module
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: "{{ git_work_dir }}"
  loop:
    - git config user.email "{{ gitea_admin_email }}"
    - git config user.name "Telco KPIs Automation"
  changed_when: false

- name: Add report files to git  # noqa: command-instead-of-module
  ansible.builtin.command: git add -A --sparse -- {{ _reports_dir | relpath(git_work_dir) }}
  args:
    chdir: "{{ git_work_dir }}"
  changed_when: false

- name: Check if there are changes to commit  # noqa: command-instead-of-module
  ansible.builtin.command: git diff --cached --quiet
  args:
    chdir: "{{ git_work_dir }}"
  register: git_diff
  failed_when: false
  changed_when: git_diff.rc != 0

- name: Commit and push changes with retry loop for concurrent access
  when: git_diff.rc != 0
  block:
    - name: Initialize retry state
      ansible.builtin.set_fact:
        _push_attempt: 0
        _push_succeeded: false
        _min_attempts: "{{ gitea_push_min_retries | int }}"
        _max_attempts: "{{ [gitea_push_max_retries | int, gitea_push_min_retries | int] | max }}"

    - name: Commit and push attempt
      ansible.builtin.include_tasks: push-with-retry.yml

    - name: Retry to commit and push with retry on conflict [1/2]
      ansible.builtin.include_tasks: push-with-retry.yml
      when: not _push_succeeded
      loop: "{{ range(0, _min_attempts | int) | list }}"
      loop_control:
        loop_var: retry_iteration
        label: "[1/2] Push attempt {{ _push_attempt }}/{{ _min_attempts }}"

    - name: Retry to commit and push with retry on conflict [2/2]
      ansible.builtin.include_tasks: push-with-retry.yml
      when: not _push_succeeded
      loop: "{{ range(_min_attempts | int, _max_attempts | int) | list }}"
      loop_control:
        loop_var: retry_iteration
        label: "[2/2] Push attempt {{ _push_attempt }}/{{ _max_attempts }}"

    - name: Fail if max attempts exhausted
      ansible.builtin.fail:
        msg: |
          Failed to push after {{ _max_attempts }} attempts.

          Multiple jobs are competing to push reports. This is expected during high concurrency.

          Last error: {{ _push_result.stderr | default('unknown') }}

          Action: The report was generated successfully but not published.
          Re-run this job to retry publishing.
      when:
        - not _push_succeeded
        - (_push_attempt | int) >= (_max_attempts | int)

- name: Cleanup temporary work directory
  ansible.builtin.file:
    path: "{{ git_work_dir }}"
    state: absent

- name: Display publication success
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "Report Published Successfully"
      - "=========================================="
      - "Spoke: {{ spoke_cluster }}"
      - "Report: {{ report_file }}"
      - "Push attempts: {{ _push_attempt | default(1) }}"
      - >-
        Web URL: {{ gitea_repo_web_url }}{{
        '/-/tree/' if report_publish_mode | default('prod') == 'prod'
        else '/src/branch/' }}{{
        report_repo_branch }}{{
        '/reports' if report_publish_mode | default('prod') != 'dev-bastion' else '' }}/{{
        report_dir_name }}/{{ spoke_cluster }}
      - "=========================================="
