---
# Mirror OCP release image (+ sigstore signatures) to disconnected registry
#
# Resolves the OCP release image to digest format, then mirrors it along with
# sigstore .sig tags to the bastion's internal registry. This ensures the spoke
# can pull and verify all art-dev images during ZTP deployment.
#
# Resolution precedence:
#   1. raw_ocp_release_image (explicit image) -- highest priority
#   2. lockdown_uri (hub or spoke lockdown JSON URL) -- auto-detects format
#   3. Neither -- falls back to hub cluster's own release image
#
# Architecture support:
#   - Defaults to x86_64 for backward compatibility
#   - Auto-detects architecture from lockdown JSON (deployment.architecture field)
#   - Accepts explicit ocp_architecture variable for override/fallback
#   - Supports multi-architecture: x86_64, aarch64, ppc64le, s390x
#   - AgentServiceConfig allows multiple osImages for same version with different architectures
#
# Architecture naming convention:
#   - Input (ocp_architecture): Uses Linux architecture names (x86_64, aarch64, ppc64le, s390x)
#     Required for RHCOS stream metadata lookup
#   - Output (AgentServiceConfig): Uses Kubernetes architecture names
#     Translation: aarch64 → arm64 (others remain unchanged)
#     Required for assisted-service compatibility
#
# Architecture precedence:
#   1. Lockdown deployment.architecture (if lockdown provided AND field exists)
#   2. Explicit ocp_architecture variable (if provided via -e)
#   3. Default: x86_64
#
# Usage with explicit image:
#   ansible-playbook -i inventories/ocp-deployment/build-inventory.py \
#     playbooks/telco-kpis/mirror-ocp.yml \
#     -e "kubeconfig=/path/to/kubeconfig \
#         raw_ocp_release_image=quay.io/openshift-release-dev/ocp-release:4.22.0-x86_64"
#
# Usage with lockdown URI (architecture auto-detected):
#   ansible-playbook -i inventories/ocp-deployment/build-inventory.py \
#     playbooks/telco-kpis/mirror-ocp.yml \
#     -e "kubeconfig=/path/to/kubeconfig \
#         lockdown_uri=https://gitlab.cee.redhat.com/.../lockdown-spoke-5.0-arm64.json"
#
# Usage with explicit architecture override:
#   ansible-playbook -i inventories/ocp-deployment/build-inventory.py \
#     playbooks/telco-kpis/mirror-ocp.yml \
#     -e "kubeconfig=/path/to/kubeconfig \
#         ocp_version=5.0 \
#         ocp_architecture=aarch64"

- name: Resolve OCP release image to digest format
  hosts: bastion
  gather_facts: false
  tasks:
    # -- Path A: Explicit release image (highest priority) --
    - name: Resolve from explicit release image
      when:
        - (raw_ocp_release_image | default('')) | length > 0
      block:
        - name: Fetch hub cluster pull secret for skopeo auth
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: pull-secret
            namespace: openshift-config
            kubeconfig: "{{ kubeconfig }}"
          register: _wrapper_hub_pull_secret
          no_log: "{{ ansible_verbosity < 3 }}"

        - name: Write pull secret to temp file
          ansible.builtin.copy:
            content: "{{ _wrapper_hub_pull_secret.resources[0].data['.dockerconfigjson'] | b64decode }}"
            dest: /tmp/resolve-digest-pull-secret.json
            mode: '0600'
          no_log: "{{ ansible_verbosity < 3 }}"

        - name: Resolve release image to digest
          ansible.builtin.include_role:
            name: lockdowns
            tasks_from: common/resolve-release-image-digest.yml
          vars:
            resolve_release_image: "{{ raw_ocp_release_image }}"
            resolve_pull_secret_path: /tmp/resolve-digest-pull-secret.json

        - name: Set ocp_release_image fact
          ansible.builtin.set_fact:
            ocp_release_image: "{{ resolved_release_image }}"

        - name: Set default architecture for explicit image path
          ansible.builtin.set_fact:
            ocp_architecture: "{{ ocp_architecture | default('x86_64') }}"

        - name: Display resolved release image
          ansible.builtin.debug:
            msg:
              - "=========================================="
              - "OCP Release Image Resolution (explicit)"
              - "=========================================="
              - "Input:    {{ raw_ocp_release_image }}"
              - "Resolved: {{ ocp_release_image }}"
              - "Architecture: {{ ocp_architecture }}"
              - "=========================================="

        - name: Remove temp pull secret file
          ansible.builtin.file:
            path: /tmp/resolve-digest-pull-secret.json
            state: absent

    # -- Path B: Lockdown URI (when no explicit image) --
    - name: Resolve from lockdown URI
      when:
        - (raw_ocp_release_image | default('')) | length == 0
        - (lockdown_uri | default('')) | length > 0
      block:
        - name: Download lockdown JSON (follows GitLab symlinks)
          ansible.builtin.include_role:
            name: lockdowns
            tasks_from: common/download-lockdown.yml
          vars:
            lockdown_download_path: /tmp/mirror-ocp-lockdown.json

        - name: Read downloaded lockdown JSON
          ansible.builtin.slurp:
            src: /tmp/mirror-ocp-lockdown.json
          register: _wrapper_lockdown_file

        - name: Parse lockdown JSON
          ansible.builtin.set_fact:
            _wrapper_lockdown_data: "{{ _wrapper_lockdown_file.content | b64decode | from_json }}"

        - name: Detect lockdown format and extract OCP pull spec
          ansible.builtin.set_fact:
            _wrapper_lockdown_format: "{{ 'hub' if 'hub' in _wrapper_lockdown_data else 'spoke' }}"
            _wrapper_extracted_image: >-
              {{
                _wrapper_lockdown_data.hub.ocp.pull_spec.digest
                if ('hub' in _wrapper_lockdown_data and
                    _wrapper_lockdown_data.hub.ocp.pull_spec is mapping)
                else (
                  _wrapper_lockdown_data.hub.ocp.pull_spec
                  if 'hub' in _wrapper_lockdown_data
                  else _wrapper_lockdown_data.deployment.ocp_pull_spec
                )
              }}

        - name: Extract architecture from lockdown data
          ansible.builtin.set_fact:
            ocp_architecture: >-
              {{
                _wrapper_lockdown_data.deployment.architecture
                if ('deployment' in _wrapper_lockdown_data and
                    'architecture' in _wrapper_lockdown_data.deployment)
                else (ocp_architecture | default('x86_64'))
              }}

        - name: Display extracted image from lockdown
          ansible.builtin.debug:
            msg:
              - "Lockdown format: {{ _wrapper_lockdown_format }}"
              - "Extracted image: {{ _wrapper_extracted_image }}"
              - "Architecture: {{ ocp_architecture }}"

        - name: Resolve lockdown image to digest (if tag-based)
          when: "'@sha256:' not in _wrapper_extracted_image"
          block:
            - name: Fetch hub cluster pull secret for skopeo auth
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Secret
                name: pull-secret
                namespace: openshift-config
                kubeconfig: "{{ kubeconfig }}"
              register: _wrapper_hub_pull_secret
              no_log: "{{ ansible_verbosity < 3 }}"

            - name: Write pull secret to temp file
              ansible.builtin.copy:
                content: "{{ _wrapper_hub_pull_secret.resources[0].data['.dockerconfigjson'] | b64decode }}"
                dest: /tmp/resolve-digest-pull-secret.json
                mode: '0600'
              no_log: "{{ ansible_verbosity < 3 }}"

            - name: Resolve extracted image to digest
              ansible.builtin.include_role:
                name: lockdowns
                tasks_from: common/resolve-release-image-digest.yml
              vars:
                resolve_release_image: "{{ _wrapper_extracted_image }}"
                resolve_pull_secret_path: /tmp/resolve-digest-pull-secret.json

            - name: Remove temp pull secret file
              ansible.builtin.file:
                path: /tmp/resolve-digest-pull-secret.json
                state: absent

        - name: Set ocp_release_image fact from lockdown
          ansible.builtin.set_fact:
            ocp_release_image: "{{ resolved_release_image | default(_wrapper_extracted_image) }}"

        - name: Display resolved release image from lockdown
          ansible.builtin.debug:
            msg:
              - "=========================================="
              - "OCP Release Image Resolution (lockdown)"
              - "=========================================="
              - "Lockdown URI:    {{ lockdown_uri }}"
              - "Lockdown format: {{ _wrapper_lockdown_format }}"
              - "Extracted:       {{ _wrapper_extracted_image }}"
              - "Resolved:        {{ ocp_release_image }}"
              - "=========================================="

        - name: Clean up lockdown temp file
          ansible.builtin.file:
            path: /tmp/mirror-ocp-lockdown.json
            state: absent

    # -- Path C: No image source --
    - name: No explicit image or lockdown URI provided
      when:
        - (raw_ocp_release_image | default('')) | length == 0
        - (lockdown_uri | default('')) | length == 0
      block:
        - name: Set default architecture for hub fallback path
          ansible.builtin.set_fact:
            ocp_architecture: "{{ ocp_architecture | default('x86_64') }}"

        - name: Display fallback message
          ansible.builtin.debug:
            msg:
              - "No OCP release image override -- will use hub cluster's own release image"
              - "Architecture: {{ ocp_architecture }} (default)"

- name: Mirror OCP release image to disconnected registry
  hosts: bastion
  gather_facts: false
  tasks:
    - name: Resolve final release image for mirror check
      when: (ocp_release_image | default('')) | length == 0
      block:
        - name: Get hub cluster release image (Path C fallback)
          kubernetes.core.k8s_info:
            api_version: config.openshift.io/v1
            kind: ClusterVersion
            name: version
            kubeconfig: "{{ kubeconfig }}"
          register: _mirror_hub_cv

        - name: Set release image from hub clusterversion
          ansible.builtin.set_fact:
            ocp_release_image: >-
              {{ _mirror_hub_cv.resources[0].status.desired.image }}

    - name: Fetch hub cluster pull secret for mirror auth
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: pull-secret
        namespace: openshift-config
        kubeconfig: "{{ kubeconfig }}"
      register: _mirror_hub_pull_secret
      no_log: "{{ ansible_verbosity < 3 }}"

    - name: Write pull secret to temp file
      ansible.builtin.copy:
        content: >-
          {{ _mirror_hub_pull_secret.resources[0].data['.dockerconfigjson']
             | b64decode }}
        dest: /tmp/mirror-rc-pull-secret.json
        mode: '0600'
      no_log: "{{ ansible_verbosity < 3 }}"

    - name: Check and mirror release image if needed
      ansible.builtin.include_role:
        name: mirror_ocp_release_candidate
      vars:
        mirror_rc_release_image: "{{ ocp_release_image }}"
        mirror_rc_kubeconfig: "{{ kubeconfig }}"
        mirror_rc_pull_secret_path: /tmp/mirror-rc-pull-secret.json
        mirror_rc_ocp_version: "{{ ocp_version | default('') }}"

    - name: Clean up temp pull secret
      ansible.builtin.file:
        path: /tmp/mirror-rc-pull-secret.json
        state: absent

# -- Play 3: Register RHCOS OS image in AgentServiceConfig ----------------
# When the spoke OCP version differs from the hub, the assisted-service
# needs a RHCOS ISO registered for the spoke version. Without it, the
# AgentClusterInstall fails with "No OS images are available for version X".
#
# This play extracts the RHCOS ISO URL from the release image metadata,
# downloads it to the bastion HTTP store, and patches the AgentServiceConfig.

- name: Register RHCOS OS image for assisted-service
  hosts: bastion
  gather_facts: false
  vars:
    http_store_data_dir: /opt/http_store/data
  tasks:
    - name: Skip if no ocp_version provided
      when: (ocp_version | default('')) | length == 0
      ansible.builtin.debug:
        msg: "No ocp_version provided — skipping RHCOS OS image registration"

    - name: Register RHCOS OS image
      when: (ocp_version | default('')) | length > 0
      block:
        - name: Fetch hub cluster pull secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: pull-secret
            namespace: openshift-config
            kubeconfig: "{{ kubeconfig }}"
          register: _rhcos_hub_pull_secret
          no_log: "{{ ansible_verbosity < 3 }}"

        - name: Write pull secret to temp file
          ansible.builtin.copy:
            content: "{{ _rhcos_hub_pull_secret.resources[0].data['.dockerconfigjson'] | b64decode }}"
            dest: /tmp/rhcos-pull-secret.json
            mode: '0600'
          no_log: "{{ ansible_verbosity < 3 }}"

        - name: Read current AgentServiceConfig
          kubernetes.core.k8s_info:
            api_version: agent-install.openshift.io/v1beta1
            kind: AgentServiceConfig
            name: agent
            kubeconfig: "{{ kubeconfig }}"
          register: _asc_info

        - name: Set default architecture if not already set
          ansible.builtin.set_fact:
            ocp_architecture: "{{ ocp_architecture | default('x86_64') }}"

        - name: Check if OS image version+architecture already registered
          ansible.builtin.set_fact:
            _existing_os_images: "{{ _asc_info.resources[0].spec.osImages | default([]) }}"

        - name: Map Linux architecture to Kubernetes architecture for lookup
          ansible.builtin.set_fact:
            _k8s_architecture_lookup: >-
              {{
                'arm64' if ocp_architecture == 'aarch64'
                else ocp_architecture
              }}

        - name: Check for matching osImage (version + architecture)
          ansible.builtin.set_fact:
            _matching_os_images: >-
              {{ _existing_os_images
                 | selectattr('openshiftVersion', 'equalto', ocp_version)
                 | selectattr('cpuArchitecture', 'equalto', _k8s_architecture_lookup)
                 | list }}

        - name: Display existing OS image version+architecture pairs
          ansible.builtin.debug:
            msg:
              - "AgentServiceConfig existing OS images:"
              - "{{ _existing_os_images | map(attribute='openshiftVersion') | zip(_existing_os_images | map(attribute='cpuArchitecture')) | list }}"
              - "Requested: version={{ ocp_version }}, architecture={{ _k8s_architecture_lookup }} (Kubernetes naming)"
              - "Source architecture: {{ ocp_architecture }} (Linux naming)"
              - "Matching entries: {{ _matching_os_images | length }}"

        - name: Add RHCOS OS image for spoke version
          when: _matching_os_images | length == 0
          block:
            - name: Create temp directory for baremetal installer
              ansible.builtin.tempfile:
                state: directory
                prefix: rhcos-bmi-
              register: _rhcos_bmi_dir

            - name: Extract openshift-baremetal-install from release image
              ansible.builtin.command:
                cmd: >-
                  oc adm release extract
                  {{ ocp_release_image }}
                  -a /tmp/rhcos-pull-secret.json
                  --command=openshift-baremetal-install
                  --to={{ _rhcos_bmi_dir.path }}
              changed_when: false

            - name: Verify openshift-baremetal-install was extracted
              ansible.builtin.stat:
                path: "{{ _rhcos_bmi_dir.path }}/openshift-baremetal-install"
              register: _bmi_stat

            - name: Assert openshift-baremetal-install is executable
              ansible.builtin.assert:
                that:
                  - _bmi_stat.stat.exists
                  - _bmi_stat.stat.executable
                fail_msg: >-
                  openshift-baremetal-install not found or not executable
                  at {{ _rhcos_bmi_dir.path }}/openshift-baremetal-install

            - name: Get RHCOS boot images metadata via print-stream-json
              ansible.builtin.command:
                cmd: >-
                  {{ _rhcos_bmi_dir.path }}/openshift-baremetal-install
                  coreos print-stream-json
              register: _rhcos_stream_json
              changed_when: false

            # Convert Kubernetes architecture naming to Linux naming for RHCOS stream lookup
            # Input (ocp_architecture) may use either naming convention:
            #   - Kubernetes: arm64, x86_64, ppc64le, s390x
            #   - Linux: aarch64, x86_64, ppc64le, s390x
            # RHCOS stream metadata always uses Linux naming
            - name: Map architecture to Linux naming for RHCOS stream lookup
              ansible.builtin.set_fact:
                _rhcos_architecture: >-
                  {{
                    'aarch64' if ocp_architecture == 'arm64'
                    else ocp_architecture
                  }}

            - name: Parse RHCOS boot images metadata
              vars:
                _stream: "{{ _rhcos_stream_json.stdout | from_json }}"
                _metal: "{{ _stream.architectures[_rhcos_architecture].artifacts.metal }}"
              ansible.builtin.set_fact:
                _rhcos_iso_remote_url: "{{ _metal.formats.iso.disk.location }}"
                _rhcos_version: "{{ _metal.release }}"

            - name: Clean up baremetal installer
              ansible.builtin.file:
                path: "{{ _rhcos_bmi_dir.path }}"
                state: absent

            - name: Set RHCOS ISO local filename and serving URL
              ansible.builtin.set_fact:
                _rhcos_iso_filename: "{{ _rhcos_iso_remote_url | basename }}"
                _rhcos_local_url: >-
                  http://{{ ansible_host }}:{{ share_http_iso_port
                  }}/{{ _rhcos_iso_remote_url | basename }}

            # Convert to Kubernetes architecture naming for AgentServiceConfig
            # AgentServiceConfig cpuArchitecture field expects Kubernetes naming:
            #   - arm64 (not aarch64)
            # Both input conventions are supported: arm64 or aarch64
            - name: Map architecture to Kubernetes naming for AgentServiceConfig
              ansible.builtin.set_fact:
                _k8s_architecture: >-
                  {{
                    'arm64' if (ocp_architecture in ['arm64', 'aarch64'])
                    else ocp_architecture
                  }}

            - name: Display RHCOS ISO details
              ansible.builtin.debug:
                msg:
                  - "RHCOS version:  {{ _rhcos_version }}"
                  - "Remote ISO URL: {{ _rhcos_iso_remote_url }}"
                  - "Local ISO URL:  {{ _rhcos_local_url }}"
                  - "Architecture (input):        {{ ocp_architecture }}"
                  - "Architecture (RHCOS lookup): {{ _rhcos_architecture }}"
                  - "Architecture (AgentServiceConfig): {{ _k8s_architecture }}"

            - name: Check if RHCOS ISO already downloaded
              ansible.builtin.stat:
                path: "{{ http_store_data_dir }}/{{ _rhcos_iso_filename }}"
              register: _rhcos_iso_stat

            - name: Download RHCOS ISO to HTTP store
              ansible.builtin.get_url:
                url: "{{ _rhcos_iso_remote_url }}"
                dest: "{{ http_store_data_dir }}/{{ _rhcos_iso_filename }}"
                mode: "0644"
              when: not _rhcos_iso_stat.stat.exists

            - name: Add OS image entry to AgentServiceConfig
              kubernetes.core.k8s_json_patch:
                api_version: agent-install.openshift.io/v1beta1
                kind: AgentServiceConfig
                name: agent
                kubeconfig: "{{ kubeconfig }}"
                patch:
                  - op: add
                    path: /spec/osImages/-
                    value:
                      cpuArchitecture: "{{ _k8s_architecture }}"
                      openshiftVersion: "{{ ocp_version }}"
                      rootFSUrl: ""
                      url: "{{ _rhcos_local_url }}"
                      version: "{{ _rhcos_version }}"

            - name: Display registration result
              ansible.builtin.debug:
                msg: >-
                  Registered RHCOS {{ _rhcos_version }} ({{ _k8s_architecture }})
                  for OCP {{ ocp_version }} in AgentServiceConfig

        - name: OS image already registered
          when: _matching_os_images | length > 0
          ansible.builtin.debug:
            msg: >-
              OS image for OCP {{ ocp_version }} ({{ _k8s_architecture_lookup }})
              already in AgentServiceConfig — skipping

        - name: Clean up temp pull secret
          ansible.builtin.file:
            path: /tmp/rhcos-pull-secret.json
            state: absent
