---
# Molecule prepare - creates mock system binaries for hardware_details testing
- name: Prepare mock environment for hardware_details role
  hosts: localhost
  gather_facts: false

  vars:
    mock_bin: /tmp/molecule-hardware-details/bin

  tasks:
    - name: Remove previous test artifacts
      ansible.builtin.file:
        path: /tmp/molecule-hardware-details
        state: absent

    - name: Create mock bin directory
      ansible.builtin.file:
        path: "{{ mock_bin }}"
        state: directory
        mode: '0755'

    - name: Create results directory
      ansible.builtin.file:
        path: /tmp/molecule-hardware-details/results
        state: directory
        mode: '0755'

    # --- dmidecode mock ---
    # Outputs 8 populated 32 GiB DIMMs + 1 empty slot
    # Configured Memory Speed (4400 MT/s) must override Speed (4800 MT/s)
    - name: Create mock dmidecode
      ansible.builtin.copy:
        dest: "{{ mock_bin }}/dmidecode"
        mode: '0755'
        content: |
          #!/bin/bash
          # Mock dmidecode - ignores all arguments
          for i in 1 2 3 4 5 6 7 8; do
          cat <<'EOF'
          Memory Device
                  Array Handle: 0x1100
                  Size: 32 GiB
                  Speed: 4800 MT/s
                  Configured Memory Speed: 4400 MT/s
                  Type: DDR5
          EOF
          done
          cat <<'EOF'
          Memory Device
                  Array Handle: 0x1100
                  Size: No Module Installed
          EOF

    # --- lsblk mock ---
    # 2 NVMe disks (aggregated as count=2) + 1 ROM device (filtered out)
    # Script calls: lsblk -J -o NAME,TYPE,SIZE,MODEL
    - name: Create mock lsblk
      ansible.builtin.copy:
        dest: "{{ mock_bin }}/lsblk"
        mode: '0755'
        content: |
          #!/bin/bash
          # Mock lsblk - ignores all arguments
          cat <<'EOF'
          {
             "blockdevices": [
                {"name": "nvme0n1", "type": "disk", "size": "894.3G", "model": "Dell NVMe PE8010 RI M.2 960GB"},
                {"name": "nvme1n1", "type": "disk", "size": "894.3G", "model": "Dell NVMe PE8010 RI M.2 960GB"},
                {"name": "sr0",     "type": "rom",  "size": "1024M",  "model": "Virtual DVD-ROM"}
             ]
          }
          EOF

    # --- ip mock ---
    # NIC script calls: ip link show
    # Outputs: lo (skip), eno1 (Dell), ens1f0 (Intel E810 port0),
    #          ens1f1 (Intel E810 port1), ens1f0v0 (VF - ethtool will fail → skipped),
    #          docker0 (virtual - matched by skip_re → skipped)
    - name: Create mock ip
      ansible.builtin.copy:
        dest: "{{ mock_bin }}/ip"
        mode: '0755'
        content: |
          #!/bin/bash
          cat <<'EOF'
          1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN
              link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00
          2: eno1: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc mq state UP
              link/ether 40:a6:b7:c0:4f:b0 brd ff:ff:ff:ff:ff:ff
          3: ens1f0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc mq state UP
              link/ether b4:96:91:b4:c2:00 brd ff:ff:ff:ff:ff:ff
          4: ens1f1: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc mq state UP
              link/ether b4:96:91:b4:c2:01 brd ff:ff:ff:ff:ff:ff
          5: ens1f0v0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc mq state UP
              link/ether b4:96:91:b4:c2:10 brd ff:ff:ff:ff:ff:ff
          6: docker0: <NO-CARRIER,BROADCAST,MULTICAST,UP> mtu 1500 qdisc noqueue state DOWN
              link/ether 02:42:8c:07:64:ac brd ff:ff:ff:ff:ff:ff
          EOF

    # --- ethtool mock ---
    # NIC script calls: ethtool -i <iface>
    # eno1       → Dell NIC at 0000:00:1f.6
    # ens1f0     → Intel E810 port 0 at 0000:3b:00.0
    # ens1f1     → Intel E810 port 1 at 0000:3b:00.1
    # ens1f0v0   → exit 1 (VF, no bus-info → NIC script skips it)
    # docker0    → skipped by skip_re before ethtool is called
    - name: Create mock ethtool
      ansible.builtin.copy:
        dest: "{{ mock_bin }}/ethtool"
        mode: '0755'
        content: |
          #!/bin/bash
          # ethtool -i <iface>  — second arg is the interface name
          iface="${2:-}"
          case "$iface" in
            eno1)
              echo "driver: igb"
              echo "version: 5.15.0"
              echo "firmware-version: 1.67, 0x80001b9f"
              echo "bus-info: 0000:00:1f.6"
              ;;
            ens1f0)
              echo "driver: ice"
              echo "version: 1.13.7"
              echo "firmware-version: 4.40 0x8001c318"
              echo "bus-info: 0000:3b:00.0"
              ;;
            ens1f1)
              echo "driver: ice"
              echo "version: 1.13.7"
              echo "firmware-version: 4.40 0x8001c318"
              echo "bus-info: 0000:3b:00.1"
              ;;
            *)
              exit 1
              ;;
          esac

    # --- lspci mock ---
    # NIC script calls: lspci -s <pci_addr> -vmm
    # Must match each PCI address and return only that device's block.
    # 0000:00:1f.6 → Dell "Ethernet 1Gb 2-port 331-i LOM"
    # 0000:3b:00.0 → Intel E810-C port 0
    # 0000:3b:00.1 → Intel E810-C port 1 (same SVendor/SDevice → aggregates with port 0 → count=2)
    - name: Create mock lspci
      ansible.builtin.copy:
        dest: "{{ mock_bin }}/lspci"
        mode: '0755'
        content: |
          #!/bin/bash
          # Match PCI address in args; return only matching device block
          args="$*"
          if echo "$args" | grep -q "1f.6\|00:1f"; then
            printf "Slot:\t0000:00:1f.6\nClass:\tEthernet controller\n"
            printf "Vendor:\tDell Inc.\nDevice:\tEthernet 1Gb 2-port 331-i LOM\n"
            printf "SVendor:\tDell Inc.\nSDevice:\tEthernet 1Gb 2-port 331-i LOM\nRev:\t31\n"
          elif echo "$args" | grep -q "3b:00.0"; then
            printf "Slot:\t0000:3b:00.0\nClass:\tEthernet controller\n"
            printf "Vendor:\tIntel Corporation\nDevice:\tEthernet Controller E810-C for SFP\n"
            printf "SVendor:\tIntel Corporation\nSDevice:\tEthernet Controller E810-C for SFP\nRev:\t02\n"
          elif echo "$args" | grep -q "3b:00.1"; then
            printf "Slot:\t0000:3b:00.1\nClass:\tEthernet controller\n"
            printf "Vendor:\tIntel Corporation\nDevice:\tEthernet Controller E810-C for SFP\n"
            printf "SVendor:\tIntel Corporation\nSDevice:\tEthernet Controller E810-C for SFP\nRev:\t02\n"
          else
            exit 1
          fi

    - name: Display preparation summary
      ansible.builtin.debug:
        msg:
          - "=================================="
          - "Mock environment ready"
          - "=================================="
          - "Mock bin: {{ mock_bin }}"
          - "Mocks: dmidecode, lsblk, ip, ethtool, lspci"
          - "Expected memory: 8 x 32 GiB = 256 GB @ 4400 MT/s"
          - "Expected storage: 2 x Dell NVMe PE8010 RI M.2 960GB"
          - "Expected NICs: Dell 1Gb (count=1), Intel E810-C (count=2)"
          - "=================================="
