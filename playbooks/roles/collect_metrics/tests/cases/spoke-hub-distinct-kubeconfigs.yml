---
collect_metrics_ci_lane: "ci-lane-1"
collect_metrics_list:
  - spoke_general_ocp
  - hub_general_ocp
collect_metrics_output_file: /tmp/collect_metrics_test/spoke-hub-distinct-kubeconfigs/metrics.txt
collect_metrics_spoke_kubeconfig: "/fake/spoke-kubeconfig"
collect_metrics_hub_kubeconfig: "/fake/hub-kubeconfig"

# Seed the spoke query only. The hub must issue its own query, which fails
# against the nonexistent kubeconfig and is reported as N/A rather than
# reusing these spoke values.
_cluster_version:
  resources:
    - status:
        desired:
          version: "4.14.77"
_infra:
  resources:
    - status:
        infrastructureName: "spoke-cluster-abc123"
_worker_nodes:
  resources: []

expected_facts:
  collect_metrics_attributes: >-
    spoke_ocp_build:4.14.77;spoke_ocp_version:4.14;spoke_cluster_name:spoke-cluster-abc123;hub_ocp_build:N/A;hub_ocp_version:N/A;hub_cluster_name:N/A;ci-lane:ci-lane-1
