---
collect_metrics_ci_lane: "ci-lane-1"
collect_metrics_list:
  - hub_general_ocp
collect_metrics_output_file: /tmp/collect_metrics_test/hub-general-ocp-happy-path/metrics.txt
collect_metrics_hub_kubeconfig: "/fake/hub-kubeconfig"

_cluster_version:
  resources:
    - status:
        desired:
          version: "4.17.9"
_infra:
  resources:
    - status:
        infrastructureName: "hub-cluster-abc123"

expected_facts:
  # hub_general_ocp does not collect worker kernels (the k8s_info task is
  # skipped via _collect_metrics_ocp_collect_worker_kernels, so no
  # *_kernel_version entries appear in the attributes string below)
  collect_metrics_attributes: "hub_ocp_build:4.17.9;hub_ocp_version:4.17;hub_cluster_name:hub-cluster-abc123;ci-lane:ci-lane-1"
