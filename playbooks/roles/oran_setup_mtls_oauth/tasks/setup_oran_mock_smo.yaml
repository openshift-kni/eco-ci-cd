- name: Mirror oran-mock-smo image
  ansible.builtin.shell: |
    oc image mirror --registry-config /tmp/oran-pull-secret.json --insecure \
      {{ oran_mock_smo_image }} {{ oran_mock_smo_image_mirrored }}
  changed_when: true

- name: Create tempfile for template
  ansible.builtin.tempfile:
    state: file
    suffix: ".yaml"
  register: oran_mock_smo_template_file

- name: Create template for oran-mock-smo
  ansible.builtin.template:
    src: oran-mock-smo.yaml.j2
    dest: "{{ oran_mock_smo_template_file.path }}"
    mode: "0644"

# no_log because the rendered manifest embeds the smo-client secret derived
# from the realm export (see tasks/main.yaml).
- name: Apply template for oran-mock-smo
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    src: "{{ oran_mock_smo_template_file.path }}"
  no_log: true

- name: Wait for oran-mock-smo to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: oran-smo-server
    namespace: oran-smo
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 60

- name: Clean up template file
  ansible.builtin.file:
    path: "{{ oran_mock_smo_template_file.path }}"
    state: absent
