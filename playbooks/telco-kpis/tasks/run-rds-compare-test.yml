---
# RDS Compare Test task for Telco-KPIs
# Purpose: Validate spoke cluster against RAN RDS metadata from telco-reference
# Output: cluster-compare.log with comparison results
# Uses: kubectl-cluster_compare in podman container
#
# Parameters:
#   - baseline: (bool, default: false) Data collection mode - always pass regardless of mismatches
#   - fail_on_rds_mismatch: (bool, default: false) Fail playbook if mismatches found
#
# Behavior:
#   - cluster-compare.log missing: Always fail (infrastructure issue)
#   - Mismatches found, baseline=true: Always pass (data collection mode)
#   - Mismatches found, baseline=false, fail_on_rds_mismatch=false (default): Report but continue
#   - Mismatches found, baseline=false, fail_on_rds_mismatch=true: Fail playbook

- name: Set test name for container naming and artifact management
  ansible.builtin.set_fact:
    test_name: "rds_compare"

- name: Ensure test-runner container image exists on bastion
  ansible.builtin.import_tasks: setup-test-runner.yml

- name: Create artifacts directory on bastion
  ansible.builtin.tempfile:
    state: directory
    suffix: .rds-compare-{{ spoke_cluster }}
    path: /tmp
  register: artifacts_dir

- name: Record test start time
  ansible.builtin.include_role:
    name: test_duration
    tasks_from: start.yml

- name: Display RDS compare configuration
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "RDS Comparison Configuration"
      - "=========================================="
      - "Spoke Cluster: {{ spoke_cluster }}"
      - "OCP Version: {{ version }}"
      - "Reference Repo: {{ reference_repo_url }}"
      - "Metadata Path: {{ metadata_relpath }}"
      - "Baseline Mode: {{ baseline | default(false) }}"
      - "Kubeconfig: {{ spoke_kubeconfig }}"
      - "Artifacts: {{ artifacts_dir.path }}"
      - "=========================================="

- name: Determine reference branch
  ansible.builtin.set_fact:
    reference_branch: "{{ reference_branch if reference_branch else 'release-' + version }}"

- name: Set telco-reference clone path
  ansible.builtin.set_fact:
    reference_repo_path: "/tmp/telco-reference-{{ spoke_cluster }}"

- name: Clone or update telco-reference repo on bastion
  ansible.builtin.git:
    repo: "{{ reference_repo_url }}"
    dest: "{{ reference_repo_path }}"
    version: "{{ reference_branch }}"
    update: true
    force: true
  register: git_clone

- name: Validate metadata file exists
  ansible.builtin.stat:
    path: "{{ reference_repo_path }}/{{ metadata_relpath }}"
  register: metadata_file
  failed_when: not metadata_file.stat.exists

- name: Display repository details
  ansible.builtin.debug:
    msg:
      - "Repository: {{ reference_repo_path }}"
      - "Branch: {{ reference_branch }}"
      - "Commit: {{ git_clone.after }}"
      - "Metadata: {{ metadata_relpath }}"

- name: Ensure kubeconfig is readable by podman container
  ansible.builtin.file:
    path: "{{ spoke_kubeconfig }}"
    mode: '0644'

- name: Template RDS compare test script to bastion
  ansible.builtin.template:
    src: templates/run-rds-compare-test.sh.j2
    dest: "{{ artifacts_dir.path }}/run-rds-compare-test.sh"
    mode: '0755'

- name: Run kubectl-cluster_compare in podman container
  containers.podman.podman_container:
    name: telco-kpis-rds-compare-{{ spoke_cluster }}
    image: "{{ telco_kpis_test_runner_image }}"
    state: started
    detach: false
    rm: true
    command: /workspace/artifacts/run-rds-compare-test.sh
    env:
      KUBECONFIG: /tmp/kubeconfig-ro
      DISABLE_PUSHGATEWAY_RAN_METRICS_UPLOAD: "true"
      DISABLE_OPENSEARCH_RAN_METRICS_UPLOAD: "true"
    volume:
      - "{{ spoke_kubeconfig }}:/tmp/kubeconfig-ro:ro,Z"
      - "{{ reference_repo_path }}:/workspace/reference:ro,Z"
      - "{{ artifacts_dir.path }}:/workspace/artifacts:rw,Z"
      - "/tmp/telco-kpis-ca-bundle.pem:/etc/pki/tls/certs/ca-bundle.crt:ro,Z"
  register: compare_result
  failed_when: false
  changed_when: false

- name: Extract container exit code
  ansible.builtin.set_fact:
    compare_exit_code: "{{ compare_result.container.State.ExitCode | default(0) }}"

- name: Count comparison results
  ansible.builtin.set_fact:
    compare_success: "{{ compare_exit_code | int == 0 }}"

- name: Validate RDS compare results were generated
  ansible.builtin.stat:
    path: "{{ artifacts_dir.path }}/cluster-compare.log"
  register: compare_log_file

- name: Fail if RDS compare results not generated
  ansible.builtin.fail:
    msg: |
      ❌ RDS Compare test execution FAILED - Results not generated

      Expected output: {{ artifacts_dir.path }}/cluster-compare.log
      Container: telco-kpis-rds-compare-{{ spoke_cluster }}
      Container exit code: {{ compare_exit_code }}

      This indicates kubectl-cluster_compare did not complete successfully.
      Check container output and test script:
        ssh {{ ansible_user }}@{{ ansible_host }} 'cat {{ artifacts_dir.path }}/run-rds-compare-test.sh'

      Review podman container logs:
        podman logs telco-kpis-rds-compare-{{ spoke_cluster }}
  when: not compare_log_file.stat.exists

- name: Fail if RDS compare found mismatches (when fail_on_rds_mismatch=true)
  ansible.builtin.fail:
    msg: |
      ❌ RDS Compare test FAILED - Cluster state does not match reference metadata

      Container: telco-kpis-rds-compare-{{ spoke_cluster }}
      Exit code: {{ compare_exit_code }}
      Reference: {{ reference_repo_url }} ({{ reference_branch }})
      Metadata: {{ metadata_relpath }}
      Comparison log: {{ artifacts_dir.path }}/cluster-compare.log
      Baseline mode: {{ baseline | default(false) }}
      Fail on mismatch: {{ fail_on_rds_mismatch | default(false) }}

      Review cluster-compare.log for detailed mismatch information.

      Note: Set baseline=true to collect results without failing.
      Note: Set fail_on_rds_mismatch=false to report but not fail on mismatches.
  when:
    - compare_exit_code | int != 0
    - not (baseline | default(false) | bool)
    - fail_on_rds_mismatch | default(false) | bool

- name: Warn about RDS compare mismatches (when not failing on mismatch)
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "⚠️  RDS Compare Warning"
      - "=========================================="
      - "Cluster state does not match reference metadata"
      - "Exit code: {{ compare_exit_code }}"
      - "Reference: {{ reference_repo_url }} ({{ reference_branch }})"
      - "Metadata: {{ metadata_relpath }}"
      - "Baseline mode: {{ baseline | default(false) }}"
      - "Fail on mismatch: {{ fail_on_rds_mismatch | default(false) }}"
      - ""
      - "Mismatches reported in comparison log - playbook continues"
      - "Set fail_on_rds_mismatch=true to fail on mismatches"
      - "Set baseline=true for data collection mode"
      - ""
      - "Review: {{ artifacts_dir.path }}/cluster-compare.log"
      - "=========================================="
  when:
    - compare_exit_code | int != 0
    - not (baseline | default(false) | bool)
    - not (fail_on_rds_mismatch | default(false) | bool)

- name: Display comparison summary
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "RDS Comparison Summary"
      - "=========================================="
      - "Exit Code: {{ compare_exit_code }}"
      - "Status: {{ 'PASS (all resources match)' if compare_success else 'FAIL (mismatches found)' }}"
      - "Baseline Mode: {{ 'Yes (non-failing)' if (baseline | default(false)) else 'No' }}"
      - "Log: {{ artifacts_dir.path }}/cluster-compare.log"
      - "=========================================="

- name: Record test duration and save metadata
  ansible.builtin.include_role:
    name: test_duration
    tasks_from: stop.yml
  vars:
    test_duration_artifacts_dir: "{{ artifacts_dir.path }}"

- name: Manage test artifacts (collect, share, report)
  ansible.builtin.include_role:
    name: artifact_management
  vars:
    artifact_management_test_name: "{{ test_name }}"
    artifact_management_spoke_cluster: "{{ spoke_cluster }}"
    artifact_management_temp_dir: "{{ artifacts_dir.path }}"
    artifact_management_test_rc: "{{ compare_exit_code }}"
    artifact_management_test_duration: "{{ test_duration_seconds }}"

- name: Cleanup artifacts directory on bastion
  ansible.builtin.file:
    path: "{{ artifacts_dir.path }}"
    state: absent

- name: Cleanup telco-reference clone on bastion
  ansible.builtin.file:
    path: "{{ reference_repo_path }}"
    state: absent

- name: Display completion message
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "RDS Comparison Complete"
      - "=========================================="
      - >-
        Result: {{ 'PASSED' if compare_success
                   else ('BASELINE COLLECTED' if (baseline | default(false))
                   else ('MISMATCHES REPORTED' if not (fail_on_rds_mismatch | default(false))
                   else 'FAILED')) }}
      - "Comparison log saved to artifacts"
      - "=========================================="
