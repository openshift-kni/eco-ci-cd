---
container_image_mirror_operation: mirror
container_image_mirror_registry_namespace: "it/"
container_image_mirror_use_pull_secret: true
container_image_mirror_images:
  - source: "registry.access.redhat.com/ubi9/ubi-micro:latest"
    dest: "mirror-with-pull-secret:latest"

# Runs against a second, auth-enabled registry instance (run_tests.py
# starts one per run) rather than the shared anonymous one - see
# README.md. container_image_mirror_pull_secret_string is computed at
# runtime by test.yml, since it has to embed that instance's dynamically
# chosen port and freshly generated credentials.
_use_auth_registry: true

assert_dest_tags_present: true
expected_mirror_success_count: 1
expected_mirror_failed_count: 0
