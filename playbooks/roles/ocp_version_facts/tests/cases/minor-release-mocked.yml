---
# ocp_version_facts_release is <=7 chars, so this exercises version-provided.yml,
# which normally resolves the latest matching z-stream over HTTP. Pre-setting
# ocp_version_facts_query (and image_age_days, which the real HTTP lookup would
# populate) short-circuits tasks/latest_release.yml's fetch block entirely -
# see README.md "Mocking the network lookup".
ocp_version_facts_release: "4.17"
ocp_version_facts_query:
  name: "4.17.23"
  pullSpec: "quay.io/openshift-release-dev/ocp-release:4.17.23-x86_64"
  downloadURL: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/4.17.23"
image_age_days: 5

expected_facts:
  ocp_version_facts_pull_spec: "quay.io/openshift-release-dev/ocp-release:4.17.23-x86_64"
  ocp_version_facts_parsed_release: "4.17.23"
  ocp_version_facts_major: "4"
  ocp_version_facts_minor: "17"
  ocp_version_facts_z_stream: "99" # Intentionally wrong - should be 23
  ocp_version_facts_release_type: "stable"
  ocp_version_facts_oc_client_pull_link: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/4.17.23/openshift-client-linux-4.17.23.tar.gz"

expected_undefined_facts:
  - ocp_version_facts_dev_version
