---
generated_dir: "{{ repo_root_path }}/generated"
manifests_dir: "{{ generated_dir }}/{{ cluster_name }}"

agent_based_installer_bootstrap_node: "{{ groups['masters'][0] }}"
host_ip_keyword: ansible_host

# Retry install complete check in case of finding issues with API VIP reachability
mabi_retry_install_complete_check: false

# GNU timeout(1) duration. Above the installer budget (40m ClusterVersion
# + 30m operators). A stuck openshift-install is killed on the bastion so
# the install-complete retry can start.
mabi_wait_timeout: 90m
# Ansible task timeout, in seconds. Slightly above mabi_wait_timeout, for a
# dead SSH channel. This fails the attempt before `until` runs; the rescue
# re-checks install completion before failing the play.
mabi_task_timeout: 5700
# GNU timeout(1) duration. wait-for returns in seconds once the cluster is up.
mabi_recheck_timeout: 3m
