---
- name: Compute FBC tag
  when: operator.fbc | default('') | length == 0
  ansible.builtin.set_fact:
    fbc_tag: >-
      {{
        operator.fbc_iib_repo
        if (operator.ocp_operator_mirror_fbc_image_base | default('')
            or (operator.catalog | default('') is search('acm|mce', ignorecase=True)))
        else 'ocp__' ~ ocp_operator_mirror_version ~ '__' ~ operator.fbc_iib_repo
      }}

- name: Set FBC workspace and source catalog
  ansible.builtin.set_fact:
    fbc_image: >-
      {{ operator.fbc if operator.fbc | default('') | length > 0
         else (operator.ocp_operator_mirror_fbc_image_base | default(ocp_operator_mirror_fbc_image_base)) ~ ':' ~ fbc_tag }}

# Pin the source so the workaround tag and lockdown metadata describe the
# exact catalog consumed by oc-mirror, even if its tag changes during the run.
- name: Resolve source catalog digest
  when: "'@' not in fbc_image"
  block:
    - name: Read source catalog image metadata
      ansible.builtin.command: >-
        skopeo inspect --no-tags
        --format {% raw %}'{{ .Digest }}'{% endraw %}
        --authfile {{ ocp_operator_mirror_pull_secret_path | quote }}
        {{ ('docker://' ~ fbc_image) | quote }}
      register: fbc_source_info
      changed_when: false

    - name: Pin source catalog digest
      ansible.builtin.set_fact:
        fbc_image: >-
          {{ fbc_image | regex_replace('(@.*|:[^/:]+)$', '') }}@{{ fbc_source_info.stdout | trim }}

- name: Compute requested FBC target
  vars:
    target_catalog: "{{ operator.fbc_target_catalog | default(ocp_operator_mirror_folder ~ '/' ~ (operator.fbc_iib_repo | default(operator.catalog)), true) }}"
    target_tag: "{{ operator.fbc_target_tag | default(ocp_operator_mirror_fbc_target_tag, true) }}"
  ansible.builtin.set_fact:
    fbc_target_catalog: "{{ target_catalog }}"
    fbc_target_tag: "{{ target_tag }}"

- name: Compute temporary FBC catalog
  ansible.builtin.set_fact:
    fbc_generated_catalog: >-
      {{ 'fbc-' ~ (fbc_target_catalog | hash('sha256'))[:7]
         if '_' in fbc_target_catalog else fbc_target_catalog }}

- name: Compute temporary FBC tag
  vars:
    digest: "{{ fbc_image.split('@')[-1].split(':')[-1] }}"
  ansible.builtin.set_fact:
    fbc_generated_tag: >-
      {{ (digest if digest[:7] in fbc_generated_catalog else digest[:7])
         if fbc_target_tag in fbc_generated_catalog else fbc_target_tag }}

- name: Validate workaround tag
  ansible.builtin.assert:
    that:
      - fbc_generated_tag not in fbc_generated_catalog
    fail_msg: "The generated FBC tag occurs in the target catalog {{ fbc_generated_catalog }}"
  when: fbc_target_tag in fbc_generated_catalog

- name: Validate FBC catalog mappings
  vars:
    existing_source: "{{ fbc_catalogs | selectattr('catalog', 'equalto', fbc_image) | list }}"
    existing_source_target: "{{ fbc_catalog_targets | selectattr('source', 'equalto', fbc_image) | list }}"
    target_image: "{{ ocp_operator_mirror_registry_url ~ '/' ~ fbc_target_catalog ~ ':' ~ fbc_target_tag }}"
    existing_target: "{{ fbc_catalog_targets | selectattr('target_image', 'equalto', target_image) | list }}"
    generated_image: "{{ ocp_operator_mirror_registry_url ~ '/' ~ fbc_generated_catalog ~ ':' ~ fbc_generated_tag }}"
    existing_generated: "{{ fbc_catalog_targets | selectattr('image', 'equalto', generated_image) | list }}"
  ansible.builtin.assert:
    that:
      - >-
        existing_source | length == 0 or
        (existing_source[0].targetCatalog == fbc_generated_catalog and existing_source[0].targetTag == fbc_generated_tag)
      - existing_source_target | length == 0 or existing_source_target[0].target_image == target_image
      - existing_target | length == 0 or existing_target[0].name == operator.catalog
      - existing_generated | length == 0 or (existing_generated[0].target_image == target_image and existing_generated[0].source == fbc_image)
      - fbc_catalog_targets | selectattr('image', 'equalto', target_image) | rejectattr('target_image', 'equalto', target_image) | list | length == 0
      - fbc_catalog_targets | selectattr('target_image', 'equalto', generated_image) | rejectattr('image', 'equalto', generated_image) | list | length == 0
    fail_msg: "FBC source and target mappings must be consistent for {{ operator.catalog }}"

- name: Add FBC catalog to configuration
  vars:
    fbc_package:
      name: "{{ operator.name }}"
      defaultChannel: "{{ operator.channel }}"
      channels:
        - name: "{{ operator.channel }}"
    existing: "{{ fbc_catalogs | selectattr('catalog', 'equalto', fbc_image) | list }}"
  ansible.builtin.set_fact:
    fbc_catalogs: >-
      {{ (fbc_catalogs | rejectattr('catalog', 'equalto', fbc_image) | list)
         + [{'catalog': fbc_image, 'targetCatalog': fbc_generated_catalog, 'targetTag': fbc_generated_tag,
             'packages': (existing[0].packages if existing | length else []) + [fbc_package]}] }}
    fbc_catalog_targets: >-
      {{ fbc_catalog_targets + [{'image': ocp_operator_mirror_registry_url ~ '/' ~ fbc_generated_catalog ~ ':' ~ fbc_generated_tag,
                                 'target_image': ocp_operator_mirror_registry_url ~ '/' ~ fbc_target_catalog ~ ':' ~ fbc_target_tag,
                                 'source': fbc_image,
                                 'name': operator.catalog}] }}

- name: Capture FBC lockdown metadata
  when: ocp_operator_mirror_generate_lockdown | default(false) | bool
  ansible.builtin.include_role:
    name: lockdowns
    tasks_from: spoke/accumulate-metadata-fbc.yml
  vars:
    lockdown_operator_data: "{{ operator }}"
    lockdown_fbc_digest: "{{ fbc_image }}"
