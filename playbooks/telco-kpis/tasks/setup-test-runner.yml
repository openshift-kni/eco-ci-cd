---
# Setup test-runner container image on bastion
# Pulls {{ telco_kpis_test_runner_image }} when not already cached,
# and writes the disconnected registry auth.json to a stable path for runtime mounting.
#
# Optional variables:
#   - force_pull_test_runner_image: Force re-pull even if image is already cached (default: false)

- name: Check if test-runner container image exists
  containers.podman.podman_image_info:
    name: "{{ telco_kpis_test_runner_image }}"
  register: image_info
  failed_when: false

- name: Set image exists fact
  ansible.builtin.set_fact:
    _image_exists: "{{ image_info.images | length > 0 }}"

- name: Remove cached image to force fresh pull
  containers.podman.podman_image:
    name: "{{ telco_kpis_test_runner_image }}"
    state: absent
  when:
    - _image_exists
    - force_pull_test_runner_image | default(false) | bool

- name: Pull test-runner container image from Quay.io
  containers.podman.podman_image:
    name: "{{ telco_kpis_test_runner_image }}"
    state: present
  when: not _image_exists or (force_pull_test_runner_image | default(false) | bool)

- name: Create disconnected registry auth.json for runtime volume mount
  ansible.builtin.copy:
    content: |
      {
        "auths": {
          "{{ disconnected_registry_url }}:{{ disconnected_registry_port }}": {
            "auth": "{{ (ansible_user ~ ':' ~ ansible_password) | b64encode }}"
          }
        }
      }
    dest: /tmp/telco-kpis-disconnected-auth.json
    mode: '0600'
  no_log: "{{ ansible_verbosity < 3 }}"

- name: Build augmented CA bundle including ran-metrics certificate chain
  ansible.builtin.shell: |
    set -o pipefail
    {
      cat /etc/pki/tls/certs/ca-bundle.crt
      openssl s_client -showcerts \
        -connect pushgateway.ran-metrics.telco5g.corp.redhat.com:443 \
        < /dev/null 2>/dev/null \
        | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/'
    } > /tmp/telco-kpis-ca-bundle.pem
  args:
    executable: /bin/bash
  changed_when: false

- name: Verify container image is available
  containers.podman.podman_image_info:
    name: "{{ telco_kpis_test_runner_image }}"
  register: image_verify
  failed_when: image_verify.images | length == 0

- name: Display success message
  ansible.builtin.debug:
    msg: "Container image {{ telco_kpis_test_runner_image }} is ready"
