---
- name: Setup NTO gotests
  hosts: bastion
  gather_facts: false
  environment:
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig }}"
  vars:
    sno_cluster: false
    artifact_dir: /tmp/artifacts
    gotest_dir: /tmp/gotest
    nto_repo: https://github.com/openshift/cluster-node-tuning-operator
    day0_installation: false
    must_gather_dir: /must-gather
  tasks:
    - name: Ensure required variables are defined
      ansible.builtin.assert:
        that:
          - cluster_name is defined
          - kubeconfig is defined

    - name: Ensure test directory does not exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - "{{ gotest_dir }}"
        - "{{ artifact_dir }}"
        - "{{ must_gather_dir }}"

    - name: Create new directory
      ansible.builtin.file:
        state: directory
        path: "{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0775'
      become: true
      loop:
        - "{{ must_gather_dir }}"
        - "{{ artifact_dir }}"

    - name: Collect Must Gather
      ansible.builtin.shell: |
        oc adm must-gather --kubeconfig={{ kubeconfig }} --dest-dir={{ must_gather_dir }}
      register: must_gather
      changed_when: must_gather.rc == 0

    - name: Get Cluster version
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: ClusterVersion
        name: version
      register: api_version

    - name: Set ocp_version
      ansible.builtin.set_fact:
        ocp_version: "{{ api_version.resources[0].status.desired.version.split('.')[:2] | join('.') }}"

    - name: Get Nodes information
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: nodes_info

    - name: Verify if it's SNO cluster
      ansible.builtin.set_fact:
        sno_cluster: true
      when: nodes_info.resources | length == 1

    - name: Get NTO deployment from cluster
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: openshift-cluster-node-tuning-operator
      register: nto_deployments

    - name: Set NTO image fact from deployment
      ansible.builtin.set_fact:
        nto_image: "{{ nto_deployments.resources[0].spec.template.spec.containers[0].image }}"

    - name: Display NTO image from cluster
      ansible.builtin.debug:
        msg: "NTO image from cluster: {{ nto_image }}"

    - name: Pull NTO image and run tests
      block:
        - name: Create temporary file for pull secret
          ansible.builtin.tempfile:
            state: file
            prefix: pull_secret_
          register: pull_secret_tempfile
          no_log: true

        - name: Get cluster pull secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: pull-secret
            namespace: openshift-config
          register: pull_secret_info
          no_log: true

        - name: Save pull secret to temporary file
          ansible.builtin.copy:
            content: "{{ pull_secret_info.resources[0].data['.dockerconfigjson'] | b64decode }}"
            dest: "{{ pull_secret_tempfile.path }}"
            mode: '0600'
          no_log: true

        - name: Pull NTO image on bastion
          containers.podman.podman_image:
            name: "{{ nto_image }}"
            auth_file: "{{ pull_secret_tempfile.path }}"
          async: 600
          poll: 30

        - name: Display pulled NTO image
          ansible.builtin.debug:
            msg: "Successfully pulled NTO image: {{ nto_image }}"

        - name: Clone NTO repository
          ansible.builtin.git:
            repo: "{{ nto_repo }}"
            dest: "{{ gotest_dir }}"
            version: "release-{{ ocp_version }}"

        - name: Set base RHEL image to rhel9 for 4.19+
          ansible.builtin.set_fact:
            base_rhel_image: rhel9
          when: ocp_version is version('4.19', '>=')

        - name: Set base RHEL image to rhel8 for 4.18-
          ansible.builtin.set_fact:
            base_rhel_image: rhel8
          when: ocp_version is version('4.18', '<=')

        - name: Create Go test script
          ansible.builtin.copy:
            dest: "{{ gotest_dir }}/run_gotests.sh"
            mode: "0777"
            content: |
              #!/bin/bash
              set -e
              export PATH=/home/telcov10n/go/bin:/usr/local/go/bin:$PATH
              export KUBECONFIG="{{ kubeconfig }}"
              export PERF_TEST_PROFILE=performance
              export IMAGE_REGISTRY="registry.stage.redhat.io/"
              export CNF_TESTS_IMAGE=openshift4/cnf-tests-{{ base_rhel_image }}:v{{ ocp_version }}
              export NTO_IMAGE={{ nto_image }}
              export BUSY_CPUS_IMAGE=${CNF_TESTS_IMAGE}
              export TEST_FOLDER_PATH='test/e2e/performanceprofile/functests'
              export MUSTGATHER_DIR="/must-gather"
              export ROLE_WORKER_CNF={% if sno_cluster | bool %}master{% else %}worker-cnf{% endif %}


              echo "Installing ginkgo and gomega..."
              go install github.com/onsi/ginkgo/v2/ginkgo@latest

              cd {{ gotest_dir }}
              go mod vendor && go mod tidy
              {% if ocp_version is version('4.15', '>=') %}
              make vet
              {% endif %}

              echo "Running gotests..."
              ginkgo   -v -r  --keep-separate-reports --keep-going  --flake-attempts=2 --junit-report=_report.xml \
              {% if label_filter is defined and label_filter != '' %}
                --label-filter="{{ label_filter }} && !hypershift" \
              {% endif %}
                --timeout=24h \
                --output-dir={{ artifact_dir }} \
                --require-suite ${TEST_FOLDER_PATH}/0_config \
                                ${TEST_FOLDER_PATH}/1_performance \
                                ${TEST_FOLDER_PATH}/2_performance_update \
                                ${TEST_FOLDER_PATH}/3_performance_status \
                                ${TEST_FOLDER_PATH}/6_mustgather_testing \
                                ${TEST_FOLDER_PATH}/7_performance_kubelet_node \
                                ${TEST_FOLDER_PATH}/8_performance_workloadhints \
                                ${TEST_FOLDER_PATH}/10_performance_ppc

      always:
        - name: Clean up pull secret temporary file
          ansible.builtin.file:
            path: "{{ pull_secret_tempfile.path }}"
            state: absent
          when: pull_secret_tempfile.path is defined
          no_log: true
