---
- name: Check the stable starting OCP release
  ansible.builtin.include_tasks: preflight_stable_upgrade.yml

- name: Install NROP at lane start version
  ansible.builtin.include_tasks: install_nrop.yml
  vars:
    nrop_catalog_source: "{{ nrop_env_from }}"
    nrop_operator_version: "{{ install_nrop_version }}"
    nrop_artifact_phase: install

- name: Verify deployment before OCP hop
  ansible.builtin.include_tasks: lanes/minor-long/verify_nrop.yml
  when: verify_deployment | bool

- name: OCP and NROP hop for minor-long
  ansible.builtin.include_tasks: upgrade_ocp.yml
  vars:
    nrop_hop_version: "{{ target_ocp_version }}"

- name: Upgrade NROP after OCP hop
  ansible.builtin.include_tasks: install_nrop.yml
  vars:
    nrop_catalog_source: "{{ nrop_env_to }}"
    nrop_operator_version: "{{ target_ocp_version }}"
    nrop_artifact_phase: upgrade

- name: Verify after upgrade
  ansible.builtin.include_tasks: lanes/minor-long/verify_nrop.yml
  when: verify_deployment | bool
