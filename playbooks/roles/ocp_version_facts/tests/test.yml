---
# Generic test runner for ocp_version_facts. Not meant to be run on its own -
# see README.md. Pass a fixture from cases/ via -e "@cases/<name>.yml".
- name: Unit test ocp_version_facts role
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    expected_facts: {}
    expected_undefined_facts: []

  tasks:
    - name: Run role under test
      ansible.builtin.include_role:
        name: ocp_version_facts

    - name: Assert expected facts match actual values
      ansible.builtin.assert:
        that:
          - (lookup('vars', item.key, default='UNDEFINED')) | string == item.value | string
        fail_msg: >-
          {{ item.key }}: expected '{{ item.value }}', got
          '{{ lookup('vars', item.key, default='UNDEFINED') }}'
        success_msg: "{{ item.key }} == {{ item.value }}"
      loop: "{{ expected_facts | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert facts that should be unset are unset
      ansible.builtin.assert:
        that:
          - lookup('varnames', '^' + item + '$') | length == 0
        fail_msg: "{{ item }} was expected to be unset but got '{{ lookup('vars', item, default='') }}'"
        success_msg: "{{ item }} is unset as expected"
      loop: "{{ expected_undefined_facts }}"
