---
- name: Require kubeconfig
  ansible.builtin.assert:
    that:
      - kubeconfig | length > 0
      - upgrade_type | length > 0
    fail_msg: kubeconfig and upgrade_type are required

- name: Require supported upgrade type
  ansible.builtin.assert:
    that:
      - upgrade_type in ['zstream', 'minor-short', 'minor-long', 'range', 'eus', 'canary']
    fail_msg: "Unsupported upgrade_type {{ upgrade_type }}"

- name: Validate UPGRADE_ENV shape
  ansible.builtin.assert:
    that:
      - upgrade_env is match('^(prod|stage)-(prod|stage)$')
    fail_msg: "upgrade_env must look like prod-stage, got {{ upgrade_env }}"

- name: Validate NROP channel and canary count
  ansible.builtin.assert:
    that:
      - nrop_channel in ['stable', 'versioned']
      - canary_node_count | string is match('^[0-9]+$')
    fail_msg: NROP channel must be stable or versioned and canary count must be non-negative

- name: Require completed canary cleanup before NROP testing
  ansible.builtin.assert:
    that:
      - canary_cleanup | bool
    fail_msg: NROP testing after canary requires canary_cleanup=true
  when:
    - upgrade_type == 'canary'
    - run_e2e_tests | bool

- name: Validate OCP references
  ansible.builtin.assert:
    that:
      - item | length == 0 or item is match('^[0-9]+\\.[0-9]+$') or (item is match('^[A-Za-z0-9][A-Za-z0-9./:_@+\\-]*$') and '/' in item)
    fail_msg: "Invalid OCP version or pullspec: {{ item }}"
  loop: "{{ [from_ocp_version] if upgrade_type == 'zstream' else [from_ocp_version, to_ocp_version] }}"

- name: Range requires matching catalog sides
  ansible.builtin.assert:
    that:
      - upgrade_env.split('-')[0] == upgrade_env.split('-')[1]
    fail_msg: "range requires stage-stage or prod-prod, got {{ upgrade_env }}"
  when: upgrade_type == 'range'

- name: Extract FROM major.minor
  ansible.builtin.set_fact:
    from_version_key: "{{ (from_ocp_version.split('@')[0].split('/')[-1].split(':')[-1] | regex_search('[0-9]+\\.[0-9]+')) | default('', true) }}"

- name: Extract TO major.minor
  ansible.builtin.set_fact:
    to_version_key: >-
      {{ (to_ocp_version.split('@')[0].split('/')[-1].split(':')[-1] | regex_search('[0-9]+[.][0-9]+'))
         | default('', true) if upgrade_type != 'zstream' else '' }}

- name: Require supported FROM version
  ansible.builtin.assert:
    that:
      - from_version_key is match('^[0-9]+\\.[0-9]+$')
    fail_msg: FROM_OCP_VERSION must specify a major.minor version or pullspec

- name: Require supported TO version for multi-version lanes
  ansible.builtin.assert:
    that:
      - to_version_key is match('^[0-9]+\\.[0-9]+$')
    fail_msg: TO_OCP_VERSION must specify a major.minor version or pullspec
  when: upgrade_type != 'zstream'

- name: Set cluster OCP version for the lane
  ansible.builtin.set_fact:
    cluster_ocp_version: "{{ to_version_key if upgrade_type == 'minor-short' else from_version_key }}"

- name: Require TO for multi-hop lanes
  ansible.builtin.assert:
    that:
      - to_version_key is version(cluster_ocp_version, '>')
    fail_msg: TO_OCP_VERSION must be a higher major.minor than FROM for {{ upgrade_type }}
  when: upgrade_type in ['minor-long', 'range', 'eus', 'canary']

- name: Require adjacent minor versions
  ansible.builtin.assert:
    that:
      - >-
        (to_version_key.split('.')[0] == from_version_key.split('.')[0] and
         to_version_key.split('.')[1] | int == from_version_key.split('.')[1] | int + 1) or
        (to_version_key.split('.')[0] | int == from_version_key.split('.')[0] | int + 1 and
         to_version_key.split('.')[1] | int == 0)
    fail_msg: "{{ upgrade_type }} requires adjacent FROM and TO versions"
  when: upgrade_type in ['minor-short', 'minor-long']

- name: Set lane facts
  ansible.builtin.set_fact:
    nrop_env_from: "{{ upgrade_env.split('-')[0] }}"
    nrop_env_to: "{{ upgrade_env.split('-')[1] }}"
    target_ocp_version: "{{ to_version_key | default('') }}"
    ocp_from_minor: "{{ cluster_ocp_version.split('.')[1] }}"
    nrop_worker_mcp: "{{ nrop_canary_profile_worker_pool if upgrade_type == 'canary' else 'worker' }}"
    install_nrop_version: "{{ from_version_key }}"
    ocp_upgrade_hops: []
    ocp_control_plane_hops: []
    ocp_hop_images: {}
    nrop_explicit_cluster_image: >-
      {{ (to_ocp_version if upgrade_type == 'minor-short' else from_ocp_version)
         if '/' in (to_ocp_version if upgrade_type == 'minor-short' else from_ocp_version) else '' }}

- name: Explain an unused OCP image
  ansible.builtin.debug:
    msg: >-
      {{ 'Z-stream ignores TO_OCP_VERSION because there is no OCP upgrade.' if upgrade_type == 'zstream'
         else 'Minor-short uses FROM_OCP_VERSION only for the NROP source version; OCP is deployed from TO_OCP_VERSION.' }}
  when: >-
    (upgrade_type == 'zstream' and '/' in to_ocp_version) or
    (upgrade_type == 'minor-short' and '/' in from_ocp_version)

- name: Validate the explicit OCP cluster image
  ansible.builtin.include_role:
    name: ocp_upgrade
    tasks_from: validate_image.yml
  vars:
    ocp_hop_target: "{{ cluster_ocp_version }}"
    ocp_hop_image: "{{ nrop_explicit_cluster_image }}"
    ocp_upgrade_pull_secret: "{{ pull_secret_string | default('') | b64decode }}"
    ocp_upgrade_require_accepted: true
  when: nrop_explicit_cluster_image | length > 0

- name: Remember the explicit OCP cluster image
  ansible.builtin.set_fact:
    nrop_explicit_cluster_digest: "{{ ocp_validated_image | regex_search('@sha256:[0-9a-f]{64}$') }}"
    nrop_explicit_cluster_version: "{{ (ocp_release_info.stdout | from_json).metadata.version }}"
  when: nrop_explicit_cluster_image | length > 0

- name: Read the cluster version for the requested image
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: ClusterVersion
    name: version
  register: nrop_explicit_cluster_cv
  when: nrop_explicit_cluster_image | length > 0

- name: Require the requested OCP image to be installed
  ansible.builtin.assert:
    that:
      - nrop_explicit_cluster_cv.resources | length == 1
      - nrop_explicit_cluster_cv.resources[0].status.desired.version | default('') == nrop_explicit_cluster_version
      - nrop_explicit_cluster_cv.resources[0].status.history | default([]) | length > 0
      - nrop_explicit_cluster_cv.resources[0].status.history[0].version | default('') == nrop_explicit_cluster_version
      - nrop_explicit_cluster_cv.resources[0].status.history[0].state | default('') == 'Completed'
      - >-
        nrop_explicit_cluster_cv.resources[0].status.desired.image | default('') == nrop_explicit_cluster_image or
        nrop_explicit_cluster_cv.resources[0].status.desired.image | default('') is search(nrop_explicit_cluster_digest ~ '$')
    fail_msg: The cluster is not running the completed OCP release specified by the selected pullspec.
  when: nrop_explicit_cluster_image | length > 0

- name: Validate custom hop images
  ansible.builtin.assert:
    that:
      - item is match('^[0-9]+\\.[0-9]+=[^\\s,]+/[^\\s,]+$')
    fail_msg: "Invalid CUSTOM_OCP_IMAGES entry: {{ item }}"
  loop: "{{ custom_ocp_images.split(',') | map('trim') | reject('equalto', '') | list }}"

- name: Build custom hop image map
  ansible.builtin.set_fact:
    ocp_hop_images: "{{ ocp_hop_images | combine({item.split('=', 1)[0]: item.split('=', 1)[1]}) }}"
  loop: "{{ custom_ocp_images.split(',') | map('trim') | reject('equalto', '') | list }}"

- name: Use explicit target pullspec for the final hop
  ansible.builtin.set_fact:
    ocp_hop_images: "{{ ocp_hop_images | combine({target_ocp_version: to_ocp_version}) }}"
  when:
    - upgrade_type in ['minor-long', 'range', 'eus', 'canary']
    - "'/' in to_ocp_version"

- name: Build the OCP upgrade path
  when: upgrade_type in ['range', 'eus', 'canary']
  block:
    - name: Initialize the upgrade path
      ansible.builtin.set_fact:
        _ocp_hop_build: []
        _ocp_hop_current_minor: "{{ cluster_ocp_version.split('.')[1] | int }}"

    - name: Add hops to each major-version boundary
      ansible.builtin.include_tasks: lanes/range/plan_major.yml
      loop: "{{ range(cluster_ocp_version.split('.')[0] | int, target_ocp_version.split('.')[0] | int) | list }}"
      loop_control:
        loop_var: ocp_hop_major
      when: upgrade_type == 'range'

    - name: Add hops within the target major
      ansible.builtin.set_fact:
        _ocp_hop_build: >-
          {{ _ocp_hop_build +
             (range((_ocp_hop_current_minor | int) + 1, (target_ocp_version.split('.')[1] | int) + 1)
              | map('string') | map('regex_replace', '^', target_ocp_version.split('.')[0] ~ '.') | list) }}
      when: upgrade_type == 'range' or cluster_ocp_version.split('.')[0] == target_ocp_version.split('.')[0]

    - name: Use the selected target for a cross-major EUS or canary hop
      ansible.builtin.set_fact:
        _ocp_hop_build: ["{{ target_ocp_version }}"]
      when:
        - upgrade_type in ['eus', 'canary']
        - cluster_ocp_version.split('.')[0] != target_ocp_version.split('.')[0]

- name: Assign range hops
  ansible.builtin.set_fact:
    ocp_upgrade_hops: "{{ _ocp_hop_build }}"
  when: upgrade_type == 'range'

- name: Set minor-long OCP hop
  ansible.builtin.set_fact:
    ocp_upgrade_hops: ["{{ target_ocp_version }}"]
  when: upgrade_type == 'minor-long'

- name: Require latest stable targets for range
  ansible.builtin.assert:
    that:
      - >-
        ocp_upgrade_hops | intersect(ocp_hop_images.keys() | list)
        | difference([target_ocp_version] if '/' in to_ocp_version else []) | length == 0
    fail_msg: range uses latest stable intermediate hops; specify the final image in TO_OCP_VERSION
  when: upgrade_type == 'range'

- name: Assign control-plane hops
  ansible.builtin.set_fact:
    ocp_control_plane_hops: "{{ _ocp_hop_build }}"
  when: upgrade_type in ['eus', 'canary']

- name: Assert eus and canary hop shape
  ansible.builtin.assert:
    that:
      - >-
        (
          cluster_ocp_version.split('.')[0] == target_ocp_version.split('.')[0]
          and (target_ocp_version.split('.')[1] | int) - (cluster_ocp_version.split('.')[1] | int) == 2
        )
        or (
          target_ocp_version.split('.')[0] | int == cluster_ocp_version.split('.')[0] | int + 1
          and target_ocp_version.split('.')[1] | int == 0
        )
    fail_msg: >-
      {{ upgrade_type }} supports same-major +2 or a transition to the next major,
      got {{ cluster_ocp_version }} -> {{ target_ocp_version }}
  when: upgrade_type in ['eus', 'canary']

- name: Validate custom OCP images before changing the cluster
  ansible.builtin.include_tasks: preflight_custom_image.yml
  loop: "{{ ocp_hop_images | dict2items }}"
  loop_control:
    loop_var: ocp_custom_image
