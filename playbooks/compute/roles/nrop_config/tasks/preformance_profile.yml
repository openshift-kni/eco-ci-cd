---
- name: Read existing performance profiles
  kubernetes.core.k8s_info:
    api_version: performance.openshift.io/v2
    kind: PerformanceProfile
  register: nrop_existing_profiles
  when: nrop_config_profile_if_missing | bool

- name: Find target nodes selected by existing performance profiles
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    label_selectors: >-
      {{ ['node-role.kubernetes.io/' ~ (nrop_target_pool | default(nrop_config_worker_pool))]
         + (item.spec.nodeSelector | default({}) | dict2items
            | community.general.json_query('[].join(`=`, [key, value])')) }}
  loop: "{{ nrop_existing_profiles.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  register: nrop_profile_target_nodes
  when: nrop_config_profile_if_missing | bool

- name: Generate performance profile when needed
  ansible.builtin.include_tasks: generate_performance_profile.yml
  when: >-
    not (nrop_config_profile_if_missing | bool) or
    nrop_profile_target_nodes.results | default([]) | map(attribute='resources') | flatten | length == 0
