---
- name: Create temporary directory
  ansible.builtin.tempfile:
    state: directory
    prefix: bootstrap-pki-
  register: pki_tmp_dir

- name: Create root CA key and cert
  ansible.builtin.shell: |
    openssl req -x509 -new -nodes -days 3650 -newkey ed25519 \
      -keyout {{ pki_tmp_dir.path }}/root-ca.key -out {{ pki_tmp_dir.path }}/root-ca.crt \
      -subj "/C=US/ST=NC/L=Raleigh/O=Red Hat/OU=Telco Verification/CN={{ cluster_name }}" \
      -addext "keyUsage=critical,cRLSign,digitalSignature,keyCertSign"
  changed_when: true

- name: Read root CA certificate and key
  ansible.builtin.slurp:
    src: "{{ pki_tmp_dir.path }}/{{ item }}"
  loop:
    - root-ca.crt
    - root-ca.key
  register: root_ca_files
  no_log: true

- name: Create root CA secret
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: root-ca
        namespace: cert-manager
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ root_ca_files.results[0].content }}"
        tls.key: "{{ root_ca_files.results[1].content }}"
  no_log: true

- name: Create custom CA certificates configmap
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: custom-ca-certs
        namespace: openshift-config
      data:
        ca-bundle.crt: "{{ root_ca_files.results[0].content | b64decode }}"
        ca-bundle.pem: "{{ root_ca_files.results[0].content | b64decode }}"

- name: Update cluster trusted CA store
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    definition:
      apiVersion: config.openshift.io/v1
      kind: Proxy
      metadata:
        name: cluster
      spec:
        trustedCA:
          name: custom-ca-certs

- name: Update default ingress controller for mTLS
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    definition:
      apiVersion: operator.openshift.io/v1
      kind: IngressController
      metadata:
        name: default
        namespace: openshift-ingress-operator
      spec:
        clientTLS:
          clientCertificatePolicy: Optional
          clientCA:
            name: custom-ca-certs

- name: Create ClusterIssuer with root CA
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ oran_hub_kubeconfig }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: root-ca-issuer
      spec:
        ca:
          secretName: root-ca

- name: Clean up temporary directory
  ansible.builtin.file:
    path: "{{ pki_tmp_dir.path }}"
    state: absent
