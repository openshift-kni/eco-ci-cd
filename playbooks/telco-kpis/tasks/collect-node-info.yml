---
# Collect Node Info task for Telco-KPIs
# Purpose: Collect comprehensive node information (BIOS, microcode, kernel, etc.)
# Output: JSON file with all collected data
# Design: Gracefully handles unreachable clusters - creates JSON even with incomplete data

- name: Initialize collection status tracking
  ansible.builtin.set_fact:
    collection_errors: []
    collection_status: "complete"

- name: Create artifacts directory on bastion
  ansible.builtin.tempfile:
    state: directory
    suffix: .collect-node-info-{{ spoke_cluster }}
    path: /tmp
  register: artifacts_dir

- name: Display collection configuration
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "Node Info Collection Configuration"
      - "=========================================="
      - "Spoke Cluster: {{ spoke_cluster }}"
      - "Kubeconfig: {{ spoke_kubeconfig }}"
      - "Artifacts: {{ artifacts_dir.path }}"
      - "=========================================="

- name: Get cluster version information
  ansible.builtin.shell: |
    oc --kubeconfig {{ spoke_kubeconfig }} get clusterversion version -o jsonpath='{.spec.clusterID}'
  register: cluster_uuid_result
  failed_when: false
  changed_when: false

- name: Track cluster UUID fetch error if failed
  ansible.builtin.set_fact:
    collection_errors: "{{ collection_errors + ['Failed to fetch cluster UUID: ' + (cluster_uuid_result.stderr | default('connection error'))] }}"
    collection_status: "incomplete"
  when: cluster_uuid_result.rc != 0

- name: Get cluster version
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: ClusterVersion
    name: version
    kubeconfig: "{{ spoke_kubeconfig }}"
  register: cluster_version_result
  failed_when: false

- name: Track cluster version fetch error if failed
  ansible.builtin.set_fact:
    collection_errors: "{{ collection_errors + ['Failed to fetch ClusterVersion: API unreachable (SSL/network error)'] }}"
    collection_status: "incomplete"
  when: >
    cluster_version_result.failed is defined and cluster_version_result.failed or
    (cluster_version_result.resources | default([]) | length == 0 and
     cluster_version_result.api_found is defined and not cluster_version_result.api_found)

- name: Set cluster info facts
  ansible.builtin.set_fact:
    cluster_name: "{{ spoke_cluster }}"
    cluster_version: "{{ cluster_version_result.resources[0].status.desired.version
      if (cluster_version_result.resources | default([]) | length > 0) else 'Unreachable' }}"
    cluster_uuid: "{{ cluster_uuid_result.stdout if cluster_uuid_result.rc == 0 else 'Unreachable' }}"

- name: Display cluster information
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "Fetching info of cluster under test..."
      - "Cluster name: {{ cluster_name }}"
      - "Cluster version: {{ cluster_version }}"
      - "Cluster UUID: {{ cluster_uuid }}"
      - "=========================================="

- name: Save cluster info to artifact file
  ansible.builtin.copy:
    content: |
      cluster_name={{ cluster_name }}
      cluster_version={{ cluster_version }}
      cluster_uuid={{ cluster_uuid }}
    dest: "{{ artifacts_dir.path }}/cluster-info.txt"
    mode: '0644'

- name: Ensure kubeconfig is readable
  ansible.builtin.file:
    path: "{{ spoke_kubeconfig }}"
    mode: '0644'

- name: Get cluster nodes
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    kubeconfig: "{{ spoke_kubeconfig }}"
  register: nodes_info
  failed_when: false

- name: Track nodes fetch error if failed
  ansible.builtin.set_fact:
    collection_errors: "{{ collection_errors + ['Failed to fetch cluster nodes: API unreachable'] }}"
    collection_status: "unreachable"
  when: >
    nodes_info.failed is defined and nodes_info.failed or
    (nodes_info.resources | default([]) | length == 0)

- name: Extract node facts (if nodes were retrieved)
  ansible.builtin.set_fact:
    node_name: "{{ nodes_info.resources[0].metadata.name }}"
    kernel_version: "{{ nodes_info.resources[0].status.nodeInfo.kernelVersion }}"
    node_arch_raw: "{{ nodes_info.resources[0].status.nodeInfo.architecture }}"
  when:
    - nodes_info.resources is defined
    - nodes_info.resources | length > 0

- name: Set default node facts (if nodes were not retrieved)
  ansible.builtin.set_fact:
    node_name: "Unreachable"
    kernel_version: "Unreachable"
    node_arch_raw: "unknown"
  when: >
    nodes_info.resources is not defined or
    (nodes_info.resources | default([]) | length == 0)

- name: Get machine-config-daemon pod on target node
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: openshift-machine-config-operator
    label_selectors:
      - k8s-app=machine-config-daemon
    field_selectors:
      - "spec.nodeName={{ node_name }}"
    kubeconfig: "{{ spoke_kubeconfig }}"
  register: mcd_pods
  failed_when: false
  when: node_name != "Unreachable"

- name: Track MCD pod fetch error if failed
  ansible.builtin.set_fact:
    collection_errors: "{{ collection_errors + ['Failed to fetch MCD pod: API unreachable or pod not found'] }}"
  when: >
    node_name == "Unreachable" or
    (mcd_pods.resources | default([]) | length == 0)

- name: Extract MCD pod name (if retrieved)
  ansible.builtin.set_fact:
    mcd_pod: "{{ mcd_pods.resources[0].metadata.name }}"
  when:
    - node_name != "Unreachable"
    - mcd_pods.resources is defined
    - mcd_pods.resources | length > 0

- name: Set default MCD pod name (if not retrieved)
  ansible.builtin.set_fact:
    mcd_pod: ""
  when: >
    node_name == "Unreachable" or
    mcd_pods.resources is not defined or
    (mcd_pods.resources | default([]) | length == 0)

- name: Get BIOS version via dmidecode
  ansible.builtin.shell: |
    oc --kubeconfig {{ spoke_kubeconfig }} \
      -n openshift-machine-config-operator \
      exec {{ mcd_pod }} \
      -c machine-config-daemon \
      -- chroot /rootfs dmidecode -t 0
  register: dmidecode_result
  failed_when: false
  changed_when: false
  when: mcd_pod != ""

- name: Track BIOS fetch error if MCD pod unavailable
  ansible.builtin.set_fact:
    collection_errors: "{{ collection_errors + ['Cannot fetch BIOS version: MCD pod unavailable'] }}"
  when: mcd_pod == ""

- name: Parse BIOS version from dmidecode output
  ansible.builtin.set_fact:
    bios_version: "{{ (dmidecode_result.stdout | default('')) | regex_search('Version:\\s+(\\S+)', '\\1') | first | default('unknown', true) }}"
  when:
    - mcd_pod != ""
    - dmidecode_result.stdout is defined

- name: Set BIOS version to unreachable if dmidecode failed or skipped
  ansible.builtin.set_fact:
    bios_version: "{{ 'Unreachable' if mcd_pod == '' else 'unknown' }}"
  when: mcd_pod == "" or dmidecode_result.stdout is not defined

- name: Get microcode version from cpuinfo
  ansible.builtin.shell: |
    oc --kubeconfig {{ spoke_kubeconfig }} \
      -n openshift-machine-config-operator \
      exec {{ mcd_pod }} \
      -c machine-config-daemon \
      -- chroot /rootfs cat /proc/cpuinfo
  register: cpuinfo_result
  failed_when: false
  changed_when: false
  when: mcd_pod != ""

- name: Track microcode fetch error if MCD pod unavailable
  ansible.builtin.set_fact:
    collection_errors: "{{ collection_errors + ['Cannot fetch microcode version: MCD pod unavailable'] }}"
  when: mcd_pod == ""

- name: Parse microcode version from cpuinfo
  ansible.builtin.set_fact:
    microcode_version: "{{ (cpuinfo_result.stdout
      | default(''))
      | regex_search('microcode\\s+:\\s+(\\S+)', '\\1')
      | default([], true) | first | default('unknown', true) }}"
  when:
    - mcd_pod != ""
    - cpuinfo_result.stdout is defined

- name: Set microcode version to unreachable if cpuinfo failed or skipped
  ansible.builtin.set_fact:
    microcode_version: "{{ 'Unreachable' if mcd_pod == '' else 'unknown' }}"
  when: mcd_pod == "" or cpuinfo_result.stdout is not defined

- name: Get CPU information via lscpu
  ansible.builtin.shell: |
    oc --kubeconfig {{ spoke_kubeconfig }} \
      -n openshift-machine-config-operator \
      exec {{ mcd_pod }} \
      -c machine-config-daemon \
      -- chroot /rootfs lscpu
  register: lscpu_result
  failed_when: false
  changed_when: false
  when: mcd_pod != ""

- name: Track CPU info fetch error if MCD pod unavailable
  ansible.builtin.set_fact:
    collection_errors: "{{ collection_errors + ['Cannot fetch CPU information: MCD pod unavailable'] }}"
  when: mcd_pod == ""

- name: Parse CPU model from lscpu output
  ansible.builtin.set_fact:
    cpu_type: "{{ (lscpu_result.stdout | default('')) | regex_search('Model name:\\s+(.+)', '\\1') | first | default('unknown', true) }}"
  when:
    - mcd_pod != ""
    - lscpu_result.stdout is defined

- name: Set CPU type to unreachable if lscpu failed or skipped
  ansible.builtin.set_fact:
    cpu_type: "{{ 'Unreachable' if mcd_pod == '' else 'unknown' }}"
  when: mcd_pod == "" or lscpu_result.stdout is not defined

- name: Get kernel cmdline
  ansible.builtin.shell: |
    oc --kubeconfig {{ spoke_kubeconfig }} \
      -n openshift-machine-config-operator \
      exec {{ mcd_pod }} \
      -c machine-config-daemon \
      -- chroot /rootfs cat /proc/cmdline
  register: cmdline_result
  failed_when: false
  changed_when: false
  when: mcd_pod != ""

- name: Track kernel cmdline fetch error if MCD pod unavailable
  ansible.builtin.set_fact:
    collection_errors: "{{ collection_errors + ['Cannot fetch kernel cmdline: MCD pod unavailable'] }}"
  when: mcd_pod == ""

- name: Set kernel cmdline fact
  ansible.builtin.set_fact:
    kernel_cmdline: "{{ 'Unreachable' if mcd_pod == '' else (cmdline_result.stdout | default('') | trim) }}"

- name: Get PerformanceProfiles
  kubernetes.core.k8s_info:
    api_version: performance.openshift.io/v2
    kind: PerformanceProfile
    kubeconfig: "{{ spoke_kubeconfig }}"
  register: performance_profiles
  failed_when: false
  when: collection_status != "unreachable"

- name: Track PerformanceProfile fetch error if failed
  ansible.builtin.set_fact:
    collection_errors: "{{ collection_errors + ['Failed to fetch PerformanceProfiles: API unreachable'] }}"
  when: >
    collection_status == "unreachable" or
    (performance_profiles.failed is defined and performance_profiles.failed)

- name: Check if master0 vault file exists
  ansible.builtin.stat:
    path: /eco-ci-cd/inventories/ocp-deployment/host_vars/master0
  register: master0_vault_stat
  delegate_to: localhost

- name: Read BMC credentials from master0 vault file
  ansible.builtin.include_vars:
    file: /eco-ci-cd/inventories/ocp-deployment/host_vars/master0
    name: master0_vault
  when: master0_vault_stat.stat.exists
  delegate_to: localhost
  no_log: "{{ ansible_verbosity < 3 }}"

- name: Set BMC credentials from vault (NEVER logged)
  ansible.builtin.set_fact:
    bmc_address: "{{ master0_vault.bmc_address | default('') }}"
    bmc_user: "{{ master0_vault.bmc_user | default('') }}"
    bmc_pass: "{{ master0_vault.bmc_password | default('') }}"
  when: master0_vault_stat.stat.exists and master0_vault is defined
  no_log: "{{ ansible_verbosity < 3 }}"

- name: Set empty BMC credentials if vault not found
  ansible.builtin.set_fact:
    bmc_address: ""
    bmc_user: ""
    bmc_pass: ""
  when: not master0_vault_stat.stat.exists

- name: Extract BMC IP from bmc_address URL
  ansible.builtin.set_fact:
    bmc_ip: "{{
      ((bmc_address | regex_search('https?://([^/]+)', '\\1'))[0] | trim)
      if (bmc_address and bmc_address | regex_search('https?://([^/]+)', '\\1'))
      else '' }}"
  no_log: "{{ ansible_verbosity < 3 }}"

- name: Query BIOS settings via Redfish (if BMC configured)
  ansible.builtin.uri:
    url: "https://{{ bmc_ip }}/redfish/v1/Systems"
    method: GET
    user: "{{ bmc_user }}"
    password: "{{ bmc_pass }}"
    force_basic_auth: true
    validate_certs: false
    timeout: 30
  register: redfish_systems
  when: bmc_ip != '' and bmc_user != '' and bmc_pass != ''
  no_log: "{{ ansible_verbosity < 3 }}"
  failed_when: false

- name: Get BIOS attributes from Redfish
  ansible.builtin.uri:
    url: "https://{{ bmc_ip }}{{ redfish_systems.json.Members[0]['@odata.id'] }}/Bios"
    method: GET
    user: "{{ bmc_user }}"
    password: "{{ bmc_pass }}"
    force_basic_auth: true
    validate_certs: false
    timeout: 30
  register: redfish_bios
  when:
    - bmc_ip != ''
    - redfish_systems is defined
    - redfish_systems.json is defined
    - redfish_systems.json.Members is defined
  no_log: "{{ ansible_verbosity < 3 }}"
  failed_when: false

- name: Normalize architecture name (amd64 -> x86_64 for BIOS validation)
  ansible.builtin.set_fact:
    node_arch: "{{ 'x86_64' if node_arch_raw == 'amd64' else node_arch_raw }}"

- name: Set arch display name (arm64 for aarch64, otherwise keep as-is)
  ansible.builtin.set_fact:
    arch: "{{ 'arm64' if node_arch == 'aarch64' else node_arch }}"

- name: Collect hardware details (vendor, model, iDRAC, memory, storage, NICs)
  when: mcd_pod != ""
  block:
    - name: Include hardware_details role
      ansible.builtin.include_role:
        name: hardware_details
  rescue:
    - name: Track hardware details fetch error
      ansible.builtin.set_fact:
        collection_errors: "{{ collection_errors + ['Failed to collect hardware details: ' + (ansible_failed_result.msg | default('unknown error'))] }}"
        hardware_details: {}

- name: Set empty hardware_details if MCD pod unavailable
  ansible.builtin.set_fact:
    hardware_details: {}
    collection_errors: "{{ collection_errors + ['Cannot collect hardware details: MCD pod unavailable'] }}"
  when: mcd_pod == ""

- name: Get ClusterVersion
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: ClusterVersion
    name: version
    kubeconfig: "{{ spoke_kubeconfig }}"
  register: cluster_version_info
  failed_when: false
  when: collection_status != "unreachable"

- name: Extract OCP version from ClusterVersion
  ansible.builtin.set_fact:
    ocp_version: >-
      {{ cluster_version_info.resources[0].status.desired.version
         if (cluster_version_info.resources | default([]) | length > 0)
         else 'Unreachable' if collection_status == 'unreachable'
         else 'N/A' }}

- name: Resolve report headline
  ansible.builtin.set_fact:
    _report_headline: "{{ report_headline | default(ocp_version ~ ' - ' ~ arch) }}"

- name: Extract raw BIOS attributes (no validation, just data collection)
  ansible.builtin.set_fact:
    bios_raw_attributes: "{{ redfish_bios.json.Attributes | default({}) }}"
  when:
    - redfish_bios is defined
    - redfish_bios.json is defined
    - redfish_bios.json.Attributes is defined

- name: Build BIOS data structure with raw attributes
  ansible.builtin.set_fact:
    bios_settings_struct:
      arch: "{{ node_arch }}"
      bmc_ip: "{{ bmc_ip }}"
      vendor: "{{ hardware_details.vendor | default('N/A') }}"
      attributes: "{{ bios_raw_attributes | default({}) }}"
  when:
    - bios_raw_attributes is defined

- name: Build node info JSON
  ansible.builtin.set_fact:
    node_info_json:
      spoke: "{{ spoke_cluster }}"
      collection_status: "{{ collection_status }}"
      collection_errors: "{{ collection_errors }}"
      node_name: "{{ node_name }}"
      ocp_version: "{{ ocp_version }}"
      cluster_uuid: "{{ cluster_uuid }}"
      arch: "{{ arch }}"
      kernel_version: "{{ kernel_version | default('') }}"
      bios_version: "{{ bios_version | default('') }}"
      microcode_version: "{{ microcode_version | default('') }}"
      cpu_type: "{{ cpu_type | default('') }}"
      kernel_cmdline: "{{ kernel_cmdline | default('') }}"
      collected_at: "{{ ansible_date_time.iso8601 }}"
      report_headline: "{{ _report_headline }}"
      manifests:
        performance_profiles: >-
          {{ (performance_profiles.resources | to_nice_yaml | b64encode)
             if (performance_profiles is defined and
                 performance_profiles.resources is defined and
                 performance_profiles.resources | length > 0)
             else '' }}
        cluster_version: >-
          {{ (cluster_version_info.resources | to_nice_json | b64encode)
             if (cluster_version_info is defined and
                 cluster_version_info.resources is defined and
                 cluster_version_info.resources | default([]) | length > 0)
             else '' }}
        nodes: >-
          {{ (nodes_info.resources | to_nice_json | b64encode)
             if (nodes_info.resources | default([]) | length > 0)
             else '' }}
      bios_settings: "{{ bios_settings_struct if bios_settings_struct is defined else None }}"
      hardware_details: "{{ hardware_details | default({}) }}"

- name: Save node info to JSON file on bastion
  ansible.builtin.copy:
    content: "{{ node_info_json | to_nice_json }}"
    dest: "{{ artifacts_dir.path }}/node-info-{{ spoke_cluster }}.json"
    mode: '0644'

- name: List artifacts generated
  ansible.builtin.find:
    paths: "{{ artifacts_dir.path }}"
    patterns: "*"
    recurse: true
  register: artifact_files

- name: Create local artifact directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'ARTIFACT_DIR') | default('/artifacts', true) }}/collect_node_info-{{ spoke_cluster }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Fetch artifacts from bastion to local
  ansible.builtin.fetch:
    src: "{{ item.path }}"
    dest: "{{ lookup('env', 'ARTIFACT_DIR') | default('/artifacts', true) }}/collect_node_info-{{ spoke_cluster }}/"
    flat: true
  loop: "{{ artifact_files.files }}"
  when: artifact_files.files | length > 0

- name: Create shared artifact base directory
  ansible.builtin.file:
    path: "/home/telcov10n/telco-kpis-artifacts/{{ spoke_cluster }}"
    state: directory
    mode: '0755'

- name: Copy node-info JSON to shared persistent location
  ansible.builtin.copy:
    src: "{{ artifacts_dir.path }}/node-info-{{ spoke_cluster }}.json"
    dest: "/home/telcov10n/telco-kpis-artifacts/{{ spoke_cluster }}/node-info-{{ spoke_cluster }}.json"
    remote_src: true
    mode: '0644'

- name: Cleanup artifacts directory on bastion
  ansible.builtin.file:
    path: "{{ artifacts_dir.path }}"
    state: absent

- name: Display collection summary
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "Node Info Collection Complete"
      - "=========================================="
      - "Collection Status: {{ collection_status | upper }}"
      - "Errors/Warnings: {{ collection_errors | length }}"
      - "{% if collection_errors | length > 0 %}Issues encountered:{% for error in collection_errors %}  - {{ error }}{% endfor %}{% endif %}"
      - "Cluster: {{ cluster_name }}"
      - "Cluster Version: {{ cluster_version }}"
      - "Cluster UUID: {{ cluster_uuid }}"
      - "Node: {{ node_name }}"
      - "BIOS: {{ bios_version | default('N/A') }}"
      - "Microcode: {{ microcode_version | default('N/A') }}"
      - "Kernel: {{ kernel_version | default('N/A') }}"
      - "BMC queried: {{ 'Yes' if (bmc_ip | default('') != '') else 'No (not configured)' }}"
      - "=========================================="
