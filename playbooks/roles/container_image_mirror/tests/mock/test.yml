---
# Generic test runner for container_image_mirror. Not meant to be run on its
# own - see README.md. Pass a fixture from cases/ via -e "@cases/<name>.yml".
- name: Unit test container_image_mirror role
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    expected_facts: {}
    expected_undefined_facts: []

  tasks:
    - name: Run role under test
      ansible.builtin.include_role:
        name: container_image_mirror

    - name: Assert expected facts match actual values
      ansible.builtin.assert:
        that:
          - (lookup('vars', item.key, default='UNDEFINED')) | string == item.value | string
        fail_msg: >-
          {{ item.key }}: expected '{{ item.value }}', got
          '{{ lookup('vars', item.key, default='UNDEFINED') }}'
        success_msg: "{{ item.key }} == {{ item.value }}"
      loop: "{{ expected_facts | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert facts that should be unset are unset
      ansible.builtin.assert:
        that:
          - lookup('varnames', '^' + item + '$') | length == 0
        fail_msg: "{{ item }} was expected to be unset but got '{{ lookup('vars', item, default='') }}'"
        success_msg: "{{ item }} is unset as expected"
      loop: "{{ expected_undefined_facts }}"

    - name: Assert mirror success/failure counts
      ansible.builtin.assert:
        that:
          - _mirror_success | length == expected_mirror_success_count
          - _mirror_failed | length == expected_mirror_failed_count
        fail_msg: >-
          expected {{ expected_mirror_success_count }} success /
          {{ expected_mirror_failed_count }} failed, got
          {{ _mirror_success | length }} success / {{ _mirror_failed | length }} failed
        success_msg: >-
          {{ expected_mirror_success_count }} success /
          {{ expected_mirror_failed_count }} failed as expected
      when: expected_mirror_success_count is defined and expected_mirror_failed_count is defined

    - name: Assert remove success/failure counts
      ansible.builtin.assert:
        that:
          - _remove_success | length == expected_remove_success_count
          - _remove_failed | length == expected_remove_failed_count
        fail_msg: >-
          expected {{ expected_remove_success_count }} success /
          {{ expected_remove_failed_count }} failed, got
          {{ _remove_success | length }} success / {{ _remove_failed | length }} failed
        success_msg: >-
          {{ expected_remove_success_count }} success /
          {{ expected_remove_failed_count }} failed as expected
      when: expected_remove_success_count is defined and expected_remove_failed_count is defined

    - name: Check whether the pull secret file was cleaned up
      ansible.builtin.stat:
        path: "{{ container_image_mirror_pull_secret_path }}"
      register: _pull_secret_stat
      when: assert_pull_secret_cleaned_up | default(false)

    - name: Assert pull secret file was cleaned up
      ansible.builtin.assert:
        that: not _pull_secret_stat.stat.exists
        fail_msg: "{{ container_image_mirror_pull_secret_path }} was expected to be removed but still exists"
      when: assert_pull_secret_cleaned_up | default(false)
